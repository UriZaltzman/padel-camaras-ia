# License policy for tests/licenses/check_licenses.py (owner: qa-seguridad).
#
# Always denied (hard-coded, no exceptions possible): AGPL, GPL, SSPL, in any
# version or spelling, unless an "OR" alternative in the same expression is allowed.

# Licenses that pass without review. SPDX ids, plus the names PyPI classifiers use.
# Anything not listed here and not copyleft is "unknown" and fails until a person
# reviews it (add it here, or add an exception below).
allowed_licenses:
  # Permissive
  - MIT
  - MIT-0
  - MIT-CMU
  - HPND
  - ISC
  - 0BSD
  - BSD
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - Python-2.0
  - PSF-2.0
  - BlueOak-1.0.0
  - Zlib
  - BSL-1.0
  - Unlicense
  - CC0-1.0
  - CC-BY-4.0
  - WTFPL
  # Weak, file-level copyleft: fine to use unmodified; changes to those files stay open.
  - MPL-2.0
  - EPL-2.0
  # PyPI classifier names ("License :: OSI Approved :: <name>")
  - MIT License
  - BSD License
  - Apache Software License
  - ISC License (ISCL)
  - Python Software Foundation License
  - Mozilla Public License 2.0 (MPL 2.0)
  - The Unlicense (Unlicense)
  - zlib/libpng License
  - Boost Software License 1.0 (BSL-1.0)
  - MIT No Attribution License (MIT-0)
  - CC0 1.0 Universal (CC0 1.0) Public Domain Dedication

# LGPL: allowed (reported as a warning). Python imports are dynamic linking and we
# ship libraries unmodified; obligations are keeping the license notice and letting
# the user replace the library. Set to false to make LGPL fail too.
allow_lgpl: true

# Packages denied by name, whatever license they declare.
denied_packages:
  - ecosystem: pypi
    name: ultralytics # AGPL-3.0 (CLAUDE.md: that is why we do not use it)

# Human-reviewed exceptions for UNKNOWN licenses (or LGPL when allow_lgpl is false).
# They cannot override AGPL/GPL/SSPL. One entry per exact version, so upgrades get
# reviewed again. All fields are required.
# - ecosystem: npm          # npm | pypi
#   name: some-package
#   version: "1.2.3"
#   license: "Custom permissive, see LICENSE"
#   reason: "Why it is OK to distribute"
#   approved_by: "Full name of the person who approved it"
exceptions: []
