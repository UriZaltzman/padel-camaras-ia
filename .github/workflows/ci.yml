name: ci

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (affected packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format (whole repo)
        run: pnpm format:check
      - name: Lint, types, tests and build of what changed
        run: >
          pnpm turbo run lint typecheck test build
          --filter="...[origin/${{ github.base_ref }}]"

  python-changes:
    name: Detect Python changes
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            packages/config:
              - 'packages/config/**'
              - 'uv.lock'
            services/edge-agent:
              - 'services/edge-agent/**'
              - 'packages/config/**'
              - 'uv.lock'
            ml:
              - 'ml/**'
              - 'packages/config/**'
              - 'uv.lock'
            infra/hardware:
              - 'infra/hardware/**'
              - 'packages/config/**'
              - 'uv.lock'

  python:
    name: Python (${{ matrix.project }})
    needs: python-changes
    if: needs.python-changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.python-changes.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy --config-file "$GITHUB_WORKSPACE/packages/config/mypy.ini" .
      - name: Tests
        # Exit code 5 means "no tests collected" (empty skeletons); anything else fails.
        run: uv run pytest || [ $? -eq 5 ]

  license-checker-lint:
    name: Lint and types (tests/licenses)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.1'
          python-version: '3.12'
      # Tools are hash-pinned in tests/licenses/requirements-lint.txt (same versions as uv.lock).
      - name: Format
        run: >
          uv run --no-project --with-requirements tests/licenses/requirements-lint.txt
          ruff format --check tests/licenses
      - name: Lint
        run: >
          uv run --no-project --with-requirements tests/licenses/requirements-lint.txt
          ruff check tests/licenses
      - name: Types
        run: >
          uv run --no-project --with-requirements tests/licenses/requirements-lint.txt
          mypy --config-file packages/config/mypy.ini tests/licenses
