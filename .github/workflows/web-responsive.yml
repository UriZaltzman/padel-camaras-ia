name: web-responsive

# Responsive device matrix of apps/web (docs/testing/responsive.md).
#  - every PR that touches the web or the design system: coverage check + 3 devices
#    (chromium phone, webkit phone, chromium desktop);
#  - nightly and by hand: the 7 devices of plan section 2.

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/contracts/**'
      - 'packages/config/**'
      - '.github/workflows/web-responsive.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: web-responsive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage map (every mapped screen has a spec)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node apps/web/scripts/check-coverage-map.mjs

  devices:
    name: Devices (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the subset; manual and nightly runs run all seven.
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["pixel-7","iphone-15","desktop"]' || '["iphone-se","iphone-15","pixel-7","ipad-portrait","ipad-landscape","laptop","desktop"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the engine the project needs (WebKit for iPhone and iPad, Chromium for the rest).
      # The runner's own apt jobs can hold the dpkg lock at start, so wait for it first; the step
      # has a time limit instead of a `timeout` wrapper, which would orphan apt and keep the lock.
      - name: Install browser
        timeout-minutes: 20
        working-directory: apps/web
        env:
          ENGINE: ${{ startsWith(matrix.project, 'i') && 'webkit' || 'chromium' }}
        run: |
          for _ in $(seq 1 60); do
            sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1 || break
            sleep 5
          done
          pnpm exec playwright install --with-deps "$ENGINE"
      - name: Run the ${{ matrix.project }} project
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.project }} --trace retain-on-failure
      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
