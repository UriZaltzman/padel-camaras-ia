name: licenses

# Fails if anything we distribute is AGPL / GPL / SSPL (Node and Python dependencies,
# and model weights registered in tests/licenses/models.yaml), or has a license
# nobody reviewed yet. Policy: tests/licenses/policy.yaml.

on:
  pull_request:
    branches: [main]

concurrency:
  group: licenses-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  licenses:
    name: License check (npm, PyPI, model weights)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.1'
          python-version: '3.12'
      # Scripts are not needed to read licenses, so they are not run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: List Node licenses
        run: pnpm licenses list --json > "$RUNNER_TEMP/pnpm-licenses.json"
      - name: Unit tests of the checker
        run: uv run --no-project --with-requirements tests/licenses/requirements.txt pytest tests/licenses
      - name: Check licenses
        run: >
          uv run --no-project --with-requirements tests/licenses/requirements.txt
          python tests/licenses/check_licenses.py
          --pnpm-json "$RUNNER_TEMP/pnpm-licenses.json"
