name: camsim-integration

# Runs the camera simulator integration tests with the real tools (FFmpeg, ffprobe,
# mediamtx, Docker) and fails if any of them is skipped: a skip here means a tool is
# missing on the runner, never an accepted result. Then brings up the Compose simulator
# with 1 court and checks it with `edge-camsim probe`, stopping and starting a camera.
#
# The workflow always runs and the jobs are skipped when nothing relevant changed,
# so it can be a required check without blocking unrelated PRs.

on:
  pull_request:
    branches: [main]

concurrency:
  group: camsim-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # RTSP server, MIT license. Same version as infra/camsim/docker-compose.yml.
  # The project publishes no checksum file, so the SHA-256 was computed from the
  # release asset: bump both together, on purpose.
  MEDIAMTX_VERSION: v1.9.3
  MEDIAMTX_SHA256: 0b885dbfa4ef9c14cd00191c57d90d804255ff50403a28b85ceee7988c535b60

jobs:
  changes:
    name: Detect camera simulator changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      camsim: ${{ steps.filter.outputs.camsim }}
    steps:
      # On pull_request the filter reads the changed files from the API: no checkout needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            camsim:
              - 'services/edge-agent/**'
              - 'infra/camsim/**'
              - 'uv.lock'
              - '.github/workflows/camsim-integration.yml'

  integration-tests:
    name: Camsim integration tests (no skips)
    needs: changes
    if: needs.changes.outputs.camsim == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/edge-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.1'
          enable-cache: true
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install mediamtx (pinned, checksum verified)
        working-directory: ${{ runner.temp }}
        run: |
          archive="mediamtx_${MEDIAMTX_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/${archive}"
          echo "${MEDIAMTX_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p mediamtx-bin
          tar -xzf "$archive" -C mediamtx-bin mediamtx LICENSE
          echo "$RUNNER_TEMP/mediamtx-bin" >> "$GITHUB_PATH"
      - name: Check every tool is on PATH
        run: |
          for tool in ffmpeg ffprobe mediamtx docker; do
            command -v "$tool" || { echo "::error::$tool is not installed"; exit 1; }
          done
          docker compose version
      - run: uv sync --locked
      - name: Integration tests
        run: >
          uv run pytest tests/test_camsim_integration.py
          -rs -v --junitxml="$RUNNER_TEMP/camsim-integration.xml"
      # The tests skip themselves when a tool is missing; in CI that must be a failure.
      - name: Fail if any integration test was skipped
        run: |
          python3 - "$RUNNER_TEMP/camsim-integration.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          for case in root.iter("testcase"):
              skip = case.find("skipped")
              if skip is not None:
                  print(f"::error::{case.get('name')} was skipped: {skip.get('message')}")
          print(f"{tests} tests, {skipped} skipped")
          if tests == 0:
              sys.exit("no integration tests were collected")
          if skipped:
              sys.exit(f"{skipped} integration test(s) skipped: every one must run in CI")
          EOF

  compose-smoke:
    name: Camsim Compose smoke test (1 court)
    needs: changes
    if: needs.changes.outputs.camsim == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_FILE: infra/camsim/docker-compose.yml
      CAMSIM_COURTS: '1'
      # Small synthetic video: the smoke test checks the plumbing, not the resolution.
      CAMSIM_TEST_VIDEO_SIZE: 640x360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the simulator
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Wait until every camera is up (edge-camsim probe)
        run: |
          probe() { docker compose exec -T camsim edge-camsim probe; }
          for attempt in $(seq 1 30); do
            if probe; then exit 0; fi
            echo "attempt $attempt: not ready yet"
            sleep 5
          done
          echo "::error::cameras never came up"
          exit 1
      - name: Stop a camera and check it goes down
        run: |
          docker compose exec -T camsim edge-camsim stop court-1-a
          for attempt in $(seq 1 15); do
            out="$(docker compose exec -T camsim edge-camsim probe)" && \
              grep -qP '^court-1-a\tdown\tok$' <<<"$out" && \
              grep -qP '^court-1-b\tup ' <<<"$out" && { echo "$out"; exit 0; }
            echo "$out"
            sleep 2
          done
          echo "::error::court-1-a did not go down"
          exit 1
      - name: Start it again and check every camera is up
        run: |
          docker compose exec -T camsim edge-camsim start court-1-a
          for attempt in $(seq 1 15); do
            out="$(docker compose exec -T camsim edge-camsim probe)" && \
              grep -qP '^court-1-a\tup ' <<<"$out" && { echo "$out"; exit 0; }
            echo "$out"
            sleep 2
          done
          echo "::error::court-1-a did not come back"
          exit 1
      - name: Simulator logs
        if: always()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
