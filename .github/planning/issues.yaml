# Issue plan for the 5 phases of docs/estructura.md ("Hoja de ruta de desarrollo").
# Owned by the orquestador. create_issues.py turns each entry into a GitHub issue, in this order,
# replacing the ids in `deps` with the real issue numbers.
#
# Fields: id, phase, agent, type (feat|chore|test), title (English, area prefix),
# what / spec / done (Spanish), deps (ids). Optional: labels (extra labels).

# ───────────────────────────── PHASE 0 · Grabar partidos reales ─────────────────────────────

- id: D01
  phase: 0
  agent: orquestador
  type: chore
  labels: [decision-needed]
  title: '[decision] Friendly club and court for recording 100 phase-0 matches'
  what: 'Elegir el club amigo y la cancha donde se instala el equipo final para grabar y etiquetar 100 partidos. Ningún agente contacta al club: lo hace una persona.'
  spec: 'estructura.md › Hoja de ruta (fase 0); pendientes.md › Otros pendientes'
  deps: []
  done: 'Club y cancha confirmados por una persona y anotados en este issue (sin datos personales). Fecha estimada de instalación.'

- id: D02
  phase: 0
  agent: orquestador
  type: chore
  labels: [decision-needed]
  title: '[decision] Approve purchase of the phase-0 kit (1 court + club box)'
  what: 'Aprobar la compra del equipo para la cancha de la fase 0 (2 cámaras, soportes, botón, cableado, computadora con GPU, switch, UPS, router 4G, gabinete). Precios estimados en infra/hardware/bom.yaml con status TODO_COTIZAR.'
  spec: 'estructura.md › Hardware y presupuesto del combo; pendientes.md › Hardware'
  deps: []
  done: 'Una persona aprueba proveedor y monto; la compra la hace una persona.'

- id: P001
  phase: 0
  agent: club-devops
  type: test
  title: '[infra] Validate bom.yaml schema and totals in CI'
  what: 'Esquema (Pydantic) para infra/hardware/bom.yaml y prueba que verifica tipos, que todo precio tenga status y que el total de control (4 canchas = US$4.320) cuadre. Es la base del cotizador de la consola.'
  spec: 'pendientes.md › Hardware; estructura.md › Hardware y presupuesto del combo'
  deps: []
  done: 'La prueba corre en CI y falla si se rompe el formato o el total de control.'

- id: P002
  phase: 0
  agent: club-devops
  type: chore
  title: '[edge] Edge agent scaffold: settings, JSON logs and Docker image'
  what: 'Estructura de services/edge-agent: configuración con Pydantic Settings validada al arrancar, logs JSON con club_id/match_id sin datos personales, SQLite local, imagen Docker base (Ubuntu + FFmpeg).'
  spec: 'especificación §1, §4; CLAUDE.md › Convenciones'
  deps: []
  done: 'uv run pytest, ruff y mypy --strict pasan; la imagen se construye en CI; arrancar sin una variable obligatoria falla con mensaje claro.'

- id: P003
  phase: 0
  agent: club-devops
  type: feat
  title: '[edge] Camera simulator that replays recorded videos as RTSP'
  what: 'Simulador de cámaras: publica videos grabados como streams RTSP (2 por cancha, A y B) para que todos los agentes prueben sin hardware. Configurable por cantidad de canchas, con opción de cortar un stream para simular una cámara caída.'
  spec: 'especificación §14 (Equipo del club: simulador de cámaras); club-devops.md › Fase 0'
  deps: [P002]
  done: 'docker compose levanta N canchas simuladas; ffprobe lee cada stream; se puede apagar y prender una cámara desde la línea de comandos.'

- id: P004
  phase: 0
  agent: club-devops
  type: feat
  title: '[edge] Minimal recorder: 10 s segments without re-encoding'
  what: 'Proceso recorder mínimo: FFmpeg lee el RTSP de cada cámara y guarda segmentos de 10 s sin recomprimir, 2560x1440 a 25 fps. En fase 0 arranca y para por línea de comandos o por un horario local, con 2 minutos de margen.'
  spec: 'especificación §4 (recorder)'
  deps: [P003]
  done: 'Con el simulador: 10 turnos seguidos de 90 min con 2 cámaras sin segmentos faltantes (verificado por prueba automática de continuidad).'

- id: P005
  phase: 0
  agent: club-devops
  type: feat
  title: '[edge] Minimal uploader: resumable multipart upload with bandwidth limit'
  what: 'Proceso uploader mínimo: sube los partidos grabados a almacenamiento compatible con S3 por partes, retomando si se corta, con límite de velocidad configurable. En local se prueba con MinIO; el bucket real (Cloudflare R2) espera a que una persona cree la cuenta.'
  spec: 'especificación §4 (uploader); §13'
  deps: [P004]
  done: 'Prueba con MinIO: cortar la red a mitad de una subida y volver la retoma sin re-subir lo ya confirmado; el límite de velocidad se respeta con ±10%.'

- id: P006
  phase: 0
  agent: club-devops
  type: chore
  title: '[infra] Phase-0 club box image and installation guide'
  what: 'Imagen y docker compose del equipo del club para la fase 0 (recorder + uploader), con guía de instalación paso a paso para la cancha del club amigo y chequeo de grabación de día y de noche.'
  spec: 'estructura.md › Hoja de ruta (fase 0); especificación §15'
  deps: [P004, P005]
  done: 'Un técnico sigue la guía en una máquina limpia y graba con el simulador sin ayuda; la guía incluye la prueba de día y de noche.'

- id: P007
  phase: 0
  agent: vision-ia
  type: chore
  title: '[ml] ML project scaffold: thresholds loader, typed schemas and Parquet IO'
  what: 'Estructura de ml/: carga validada de ml/config/thresholds.yaml (con los valores iniciales de las secciones 5 a 7), modelos Pydantic base, y helpers para que cada etapa guarde y lea su salida en Parquet.'
  spec: 'especificación §1 (Python), §5'
  deps: []
  done: 'ruff, mypy --strict y pytest pasan; ningún umbral numérico fuera de thresholds.yaml (prueba que lo verifica).'

- id: P008
  phase: 0
  agent: vision-ia
  type: feat
  title: '[ml] Labeling data model for shots, bounces, shot types and point winners'
  what: 'Modelo de datos de etiquetas: golpes (tiempo, jugador), botes con superficie (floor, back_glass, side_glass, fence, net), tipo de golpe (10 clases) y ganador de cada punto. Guardado en Parquet, versionado por partido.'
  spec: 'especificación §8 (Qué se etiqueta), §5'
  deps: [P007]
  done: 'Pruebas de ida y vuelta (guardar y leer) y de validación de cada tipo de etiqueta.'

- id: P009
  phase: 0
  agent: vision-ia
  type: feat
  title: '[ml] Timeline labeling tool: shots and bounces with surface'
  what: 'Herramienta propia de etiquetado sobre la línea de tiempo del partido para marcar golpes y botes con su superficie. Corre local en ml/labeling; después web-paneles la integra en la consola interna.'
  spec: 'especificación §8; estructura.md › Nosotros (herramienta de etiquetado)'
  deps: [P008]
  done: 'Se etiqueta un partido de prueba completo con atajos de teclado y el Parquet resultante valida contra el modelo de P008.'

- id: P010
  phase: 0
  agent: vision-ia
  type: feat
  title: '[ml] Labeling tool: shot type on 1-second clips'
  what: 'Modo de la herramienta para clasificar el tipo de golpe sobre clips de 1 segundo alrededor de cada golpe etiquetado.'
  spec: 'especificación §8 (Tipo de golpe: 3.000 golpes, 150 por tipo)'
  deps: [P009]
  done: 'Se clasifican 50 golpes de prueba y la herramienta muestra el conteo por tipo contra la meta de 150.'

- id: P011
  phase: 0
  agent: vision-ia
  type: feat
  title: '[ml] Labeling tool: point winner per point'
  what: 'Modo de la herramienta para marcar dónde empieza y termina cada punto y quién lo ganó.'
  spec: 'especificación §8 (Ganador de cada punto: 100 partidos)'
  deps: [P009]
  done: 'Se etiqueta un partido completo y el marcador reconstruido desde las etiquetas coincide con el marcador real.'

- id: P012
  phase: 0
  agent: vision-ia
  type: chore
  title: '[ml] CVAT setup and converters for player boxes and ball points'
  what: 'Configuración de CVAT (local) con pre-etiquetado del detector genérico de licencia Apache 2.0, y conversores de la exportación de CVAT a los Parquet del pipeline.'
  spec: 'especificación §8 (recuadros de jugadores y posición de la pelota)'
  deps: [P007]
  done: 'Una exportación de prueba de CVAT se convierte sin pérdida; el pre-etiquetado no usa Ultralytics.'

- id: P013
  phase: 0
  agent: vision-ia
  type: chore
  title: '[ml] Labeling plan and fixed 15-match evaluation holdout'
  what: 'Plan de etiquetado con cantidades por tipo de dato (día y noche) y definición de los 15 partidos que nunca entran al entrenamiento.'
  spec: 'especificación §8 (Reglas de entrenamiento)'
  deps: [P008]
  done: 'Documento en ml/ con el plan y archivo versionado con la lista fija del holdout; prueba que impide usarlos en entrenamiento.'

- id: P014
  phase: 0
  agent: vision-ia
  type: test
  title: '[ml] Pipeline speed benchmark harness for the club GPU'
  what: 'Herramienta que mide cuántas veces más rápido que el tiempo real corre el pipeline por cámara, para medirlo en la GPU del club (meta 6x en clase RTX 4060).'
  spec: 'especificación §4 (Dimensionamiento), §17'
  deps: [P007]
  done: 'El benchmark corre con el simulador y deja el resultado en un reporte; la medición real en la GPU del club se anota en este issue.'

- id: Q0
  phase: 0
  agent: qa-seguridad
  type: test
  labels: [phase-close]
  title: '[qa] Phase 0 closed: real matches recorded and labeled'
  what: 'Verificar los criterios de aceptación de la fase 0, uno por uno.'
  spec: 'estructura.md › Hoja de ruta (fase 0)'
  deps:
    [D01, D02, P001, P002, P003, P004, P005, P006, P007, P008, P009, P010, P011, P012, P013, P014]
  done: "- [ ] El hardware graba bien de día y de noche en la cancha del club amigo\n- [ ] 100 partidos grabados\n- [ ] Partidos etiquetados según el plan de P013\n- [ ] Velocidad del pipeline medida en la GPU del club (P014)"

# ───────────────────────────── PHASE 1 · Grabación y plataforma ─────────────────────────────
