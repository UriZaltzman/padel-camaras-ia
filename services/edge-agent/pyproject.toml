[project]
name = "edge-agent"
version = "0.0.0"
description = "Agent that runs on the club's GPU box: record, clip, process, upload."
requires-python = ">=3.12,<3.13"
dependencies = ["app-config", "pydantic>=2.9", "pydantic-settings>=2.6"]

[project.scripts]
edge-agent = "edge_agent.__main__:main"
edge-camsim = "edge_agent.camsim.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
app-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_agent"]

[tool.ruff]
extend = "../../packages/config/ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Same as the shared config: its "**/tests/**" glob is resolved relative to
# packages/config, so it does not reach this project's tests.
"tests/**" = ["S101", "PLR2004", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
