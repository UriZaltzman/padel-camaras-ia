# Shared ruff config. Python projects extend it from their pyproject.toml:
#   [tool.ruff]
#   extend = "../../packages/config/ruff.toml"
target-version = "py312"
line-length = 100

[lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "PL", "RUF", "S", "T20", "DTZ", "ANN",
]
ignore = [
  "PLR0913", # pipeline stages may take several typed inputs
]

[lint.per-file-ignores]
# Ruff resolves patterns that contain a "/" relative to the file that defines them
# (this one, in packages/config), even when a project pulls it in with `extend`.
# "../../" anchors the glob at the repository root, so it reaches the tests of every
# project that extends this config (services/*, ml, packages/*). Projects do not need
# to repeat it in their own pyproject.toml.
"../../**/tests/**" = ["S101", "PLR2004", "ANN"]

[format]
quote-style = "double"
