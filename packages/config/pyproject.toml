[project]
name = "app-config"
version = "0.0.0"
description = "Shared Python config: brand mirror and lint settings"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.13", "pydantic>=2.9", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["brand.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
