          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
