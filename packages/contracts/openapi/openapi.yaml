openapi: 3.1.0

info:
  title: Padel Camera Platform API
  version: 0.1.0
  summary: Public REST contract for the mobile app, the web, the club panel and the club device.
  description: |
    REST API with JSON bodies under `/v1`. This file is the single source of truth: TypeScript
    and Pydantic types are generated from it and are never written by hand.

    ## Conventions

    - JSON property names are `snake_case`.
    - IDs are UUID v7 (`Uuid`).
    - Timestamps are RFC 3339 in UTC (`Timestamp`). Clients display them in
      `America/Argentina/Buenos_Aires`.
    - Money is an integer number of ARS cents (`AmountCents`). Never decimals.
    - Every response carries an `X-Request-Id` header. Support uses it to find the request in the
      structured logs.

    ## Errors

    Every 4xx and 5xx response has the same body, the `Error` schema: `{code, message, details}`.

    - `code` is a stable, upper-case identifier from the `ErrorCode` catalog (for example
      `BOOKING_SLOT_TAKEN`). Clients branch on `code`, never on `message` or on the HTTP status
      alone. Codes are never renamed or reused; removing one requires a new major version.
    - `message` is a short text for the end user, in `es-AR`, taken from the API translation
      files. Clients may show it as a fallback when they have no copy of their own for `code`.
    - `details` is optional and machine-readable. Its shape depends on `code` and is documented in
      the catalog. It never contains personal data, tokens or stack traces: technical detail goes
      to the log, linked by `X-Request-Id`.

    HTTP status usage: `400` malformed request, `401` missing or invalid credentials, `403` not
    allowed, `404` not found (also used when the caller may not know the resource exists), `409`
    conflict with the current state, `410` gone for good, `422` well-formed but breaks a business
    rule, `429` rate limited, `5xx` server or provider failure.

    ## Pagination

    Lists use opaque cursors: `?cursor=&limit=`. `limit` defaults to 20 and accepts 1 to 50; a value
    outside that range is rejected with `VALIDATION_FAILED`. The response wraps the items in a
    page object whose `next_cursor` is `null` on the last page. Clients pass `next_cursor` back
    unchanged; a malformed or expired cursor returns `INVALID_CURSOR`. List operations reuse the
    `Cursor` and `Limit` parameters and build their response schema with `allOf` over `Page`.

    ## Rate limits

    60 requests per minute per authenticated user, and per client IP for unauthenticated
    requests. Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset`. Going over the limit returns `429` with `RATE_LIMITED` and a `Retry-After`
    header in seconds.
  contact:
    name: arquitecto (contract owner)
    url: https://github.com/UriZaltzman/padel-camaras-ia
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-rate-limit:
    requests: 60
    window_seconds: 60
    scope: user

servers:
  - url: /v1
    description: Same host as the client. Each environment serves the API under `/v1`.

security:
  - bearerAuth: []

tags:
  - name: System
    description: Liveness and operational endpoints.
  - name: Auth
    description: Sign-in with a WhatsApp code, Google or Apple, and session renewal.
  - name: Users
    description: The signed-in user's profile, matches, stats and account deletion.
  - name: Matches
    description: Match detail, "este soy yo", score corrections and clips cut in the app.
  - name: Media
    description: Signed 1-hour links and downloads of videos, clips, reels and thumbnails.
  - name: Clubs
    description: Clubs, their courts and booking rules, and the owner's club settings.
  - name: Bookings
    description: Court availability, holds, invites, cancellations and fixed weekly turns.
  - name: ClubAdmin
    description: Club panel for staff and owner. Staff never see personal stats or money.

# Every operation must:
# - document `429` and reference `components/responses` for every 4xx and 5xx response;
# - reuse `Cursor` and `Limit` when it returns a list.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness probe
      description: |
        The process is up and serving. It does not check the database or Redis yet. No
        credentials needed.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/whatsapp:
    post:
      operationId: requestWhatsappOtp
      tags: [Auth]
      summary: Send a sign-in code by WhatsApp
      description: |
        Sends a 6-digit code to the phone by WhatsApp. The code is valid for 5 minutes and allows
        5 attempts. Asking again replaces the previous code. The response is the same whether or
        not the phone has an account, so it does not reveal who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phone: '+5491155550123'
      responses:
        '202':
          description: The code was sent (or queued for sending).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                expires_in_seconds: 300
                resend_after_seconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/verify:
    post:
      operationId: verifyWhatsappOtp
      tags: [Auth]
      summary: Sign in with the WhatsApp code
      description: |
        Checks the code and returns a session. If the phone has no account yet, one is created;
        `consent` is then required, otherwise the answer is `403 TERMS_NOT_ACCEPTED` and the
        code stays valid so the app can retry with consent. For existing accounts `consent` is
        ignored.

        Errors: `OTP_INVALID` (with `attempts_remaining`), `OTP_EXPIRED`,
        `OTP_ATTEMPTS_EXCEEDED`, `TERMS_NOT_ACCEPTED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            examples:
              sign_up:
                summary: New account, accepting terms and privacy
                value:
                  phone: '+5491155550123'
                  code: '482913'
                  consent:
                    terms_version: '2026-10-01'
                    privacy_version: '2026-10-01'
              sign_in:
                summary: Existing account
                value:
                  phone: '+5491155550123'
                  code: '482913'
      responses:
        '200':
          description: Signed in. `is_new_user` tells the app whether to show onboarding.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/google:
    post:
      operationId: signInWithGoogle
      tags: [Auth]
      summary: Sign in with Google
      description: |
        Exchanges a Google ID token (obtained by the app or web with the Google SDK) for a
        session. The server verifies signature, audience and expiry. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthSignInRequest'
            example:
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
              nonce: 3f9c2a7b1e
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/apple:
    post:
      operationId: signInWithApple
      tags: [Auth]
      summary: Sign in with Apple
      description: |
        Exchanges an Apple identity token for a session. Apple sends the user's name only on the
        first authorization, so the app forwards it in `full_name` that time. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
            example:
              id_token: eyJraWQiOiJXNldjT0tCIiwiYWxnIjoiUlMyNTYifQ...
              nonce: 8d1e4b6a0c
              full_name: Sofía Pérez
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renew the session
      description: |
        Exchanges a refresh token (valid 30 days) for a new access token (15 minutes) and a new
        refresh token. The old refresh token is revoked on use; presenting it again returns
        `REFRESH_TOKEN_INVALID` and revokes the whole token family (reuse detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5b.Zx8kQ2
      responses:
        '200':
          description: New token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIwMTky...
                refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5c.Yp3nR7
                token_type: Bearer
                expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get the signed-in user's profile
      description: The full own profile, including the consents and the training preference.
      responses:
        '200':
          description: The profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                player:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMe
      tags: [Users]
      summary: Update the signed-in user's profile and preferences
      description: |
        Partial update: only the fields present change; `null` clears an optional field. Phone
        and email are not editable here (they come from the sign-in identities).
        `training_opt_out: true` excludes the user's videos from AI training (section 12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              display_name: Sofi Pérez
              declared_category: '6'
              playing_side: drive
              training_opt_out: true
      responses:
        '200':
          description: The updated profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                player:
                  $ref: '#/components/examples/UserExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMe
      tags: [Users]
      summary: Delete the signed-in user's account
      description: |
        Revokes every session at once and schedules the deletion of the profile, stats and own
        clips within 30 days (Ley 25.326). Full match videos are deleted after 30 days anyway.
        Idempotent: calling it again returns the same scheduled date.
      responses:
        '202':
          description: Deletion scheduled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
              example:
                deletion_scheduled_for: '2026-11-16T21:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/matches:
    get:
      operationId: listMyMatches
      tags: [Users]
      summary: List the signed-in user's matches
      description: Matches where the user is a confirmed player, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: Only matches in this status.
          schema:
            $ref: '#/components/schemas/MatchStatus'
      responses:
        '200':
          description: One page of matches.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSummaryPage'
              example:
                items:
                  - id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
                    type: match
                    status: published
                    starts_at: '2026-10-15T22:00:00Z'
                    ends_at: '2026-10-15T23:30:00Z'
                    club:
                      id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a60
                      name: Pádel Norte
                    court:
                      id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a61
                      name: Cancha 2
                    team: 1
                    won: true
                    sets:
                      - team_1: 6
                        team_2: 4
                      - team_1: 7
                        team_2: 5
                next_cursor: eyJzdGFydHNfYXQiOiIyMDI2LTEwLTE1In0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/stats:
    get:
      operationId: getMyStats
      tags: [Users]
      summary: Get the signed-in user's aggregate stats
      description: Totals over the user's published matches. Lessons do not count.
      responses:
        '200':
          description: The stats.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
              example:
                matches_played: 24
                matches_won: 14
                sets_won: 31
                sets_lost: 22
                points_won: 812
                points_played: 1530
                rating: 4.35
                last_match_at: '2026-10-15T23:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Get a match with its players, score, stats and clips
      description: |
        Visible to the match players (any status), to coaches the player gave access to, and to
        the club staff and owner. Staff and owner get the match without personal stats: every
        `players[].stats` and `insights` is `null` for them (section 12).

        Before the match is published, `sets`, `points_to_review`, `insights` and stats are empty
        or `null`. The four `players` positions exist from `published` on, one per tracked
        player, each with a `thumbnail_media_id`; the app shows them for "este soy yo"
        (`POST /matches/{id}/claim-player`). Media is referenced by id only and fetched with
        `GET /media/{id}/url`: no field here is a permanent video URL.

        Errors: `NOT_FOUND` (also when the caller may not see the match),
        `COACH_ACCESS_NOT_GRANTED` (403).
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: The match.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
              examples:
                published:
                  $ref: '#/components/examples/MatchDetailExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}/claim-player:
    post:
      operationId: claimMatchPlayer
      tags: [Matches]
      summary: Claim a player position ("este soy yo")
      description: |
        The signed-in user says which of the four tracked players they are (section 5, step 4).
        No facial recognition: the user picks the thumbnail. Each confirmation narrows the
        options of the others. Stats of an unclaimed position stay stored until someone claims
        it. A user who was in the booking (`booking_players`) or scanned the court QR may claim;
        so may anyone with the match invite link.

        Errors: `MATCH_NOT_PUBLISHED` (409, positions exist only after the analysis),
        `MATCH_PLAYER_SLOT_TAKEN` (409), `MATCH_ALREADY_JOINED` (409, the user already holds
        another position), `TERMS_NOT_ACCEPTED` (403), `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimPlayerRequest'
            example:
              position: 3
      responses:
        '200':
          description: The match, with the caller in the claimed position.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}/score-correction:
    post:
      operationId: correctMatchScore
      tags: [Matches]
      summary: Correct the score (final result or a doubtful point)
      description: |
        A confirmed player of the match corrects the score (section 6, correction layers 2
        and 3):

        - `point_winner`: confirms who won one point flagged in `points_to_review`
          (confidence under 0.7).
        - `final_score`: loads the real result (for example 6-4 6-3); a Viterbi-style alignment
          picks the most likely sequence of point winners that ends in that result.

        The match moves `published` → `needs_review` and back to `published` when the stats are
        recomputed; `match.score_corrected` is emitted. Every correction is stored and used to
        retrain the models. The response is `202` because the recomputation is asynchronous.

        Errors: `MATCH_NOT_PUBLISHED` (409), `INVALID_STATE_TRANSITION` (409, a correction is
        already being applied), `FORBIDDEN` (the caller is not a confirmed player),
        `VALIDATION_FAILED` (400, impossible score or unknown point), `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreCorrectionRequest'
            examples:
              final_score:
                summary: The players load the real result
                value:
                  type: final_score
                  sets:
                    - team_1: 6
                      team_2: 4
                    - team_1: 6
                      team_2: 3
              point_winner:
                summary: Confirm the winner of a doubtful point
                value:
                  type: point_winner
                  point_id: 0192d1e4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  winner_team: 2
      responses:
        '202':
          description: Correction accepted; the match is `needs_review` until stats are recomputed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreCorrection'
              example:
                id: 0192d1e4-5a6b-7c8d-9e0f-1a2b3c4d5e70
                match_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
                type: final_score
                match_status: needs_review
                created_at: '2026-10-16T01:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /matches/{id}/clips:
    get:
      operationId: listMatchClips
      tags: [Matches]
      summary: List the clips of a match
      description: |
        Clips of the match (app taps, court button and automatic highlights), in video order.
        Visible to whoever may see the match. Each clip references its media by id.
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of clips.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMatchClip
      tags: [Matches]
      summary: Cut a clip from the match video in the app
      description: |
        A player of the match cuts a clip after the fact, choosing start and end on the video
