openapi: 3.1.0

info:
  title: Padel Camera Platform API
  version: 0.1.0
  summary: Public REST contract for the mobile app, the web, the club panel and the club device.
  description: |
    REST API with JSON bodies under `/v1`. This file is the single source of truth: TypeScript
    and Pydantic types are generated from it and are never written by hand.

    ## Conventions

    - JSON property names are `snake_case`.
    - IDs are UUID v7 (`Uuid`).
    - Timestamps are RFC 3339 in UTC (`Timestamp`). Clients display them in
      `America/Argentina/Buenos_Aires`.
    - Money is an integer number of ARS cents (`AmountCents`). Never decimals.
    - Every response carries an `X-Request-Id` header. Support uses it to find the request in the
      structured logs.

    ## Errors

    Every 4xx and 5xx response has the same body, the `Error` schema: `{code, message, details}`.

    - `code` is a stable, upper-case identifier from the `ErrorCode` catalog (for example
      `BOOKING_SLOT_TAKEN`). Clients branch on `code`, never on `message` or on the HTTP status
      alone. Codes are never renamed or reused; removing one requires a new major version.
    - `message` is a short text for the end user, in `es-AR`, taken from the API translation
      files. Clients may show it as a fallback when they have no copy of their own for `code`.
    - `details` is optional and machine-readable. Its shape depends on `code` and is documented in
      the catalog. It never contains personal data, tokens or stack traces: technical detail goes
      to the log, linked by `X-Request-Id`.

    HTTP status usage: `400` malformed request, `401` missing or invalid credentials, `403` not
    allowed, `404` not found (also used when the caller may not know the resource exists), `409`
    conflict with the current state, `410` gone for good, `422` well-formed but breaks a business
    rule, `429` rate limited, `5xx` server or provider failure.

    ## Pagination

    Lists use opaque cursors: `?cursor=&limit=`. `limit` defaults to 20 and accepts 1 to 50; a value
    outside that range is rejected with `VALIDATION_FAILED`. The response wraps the items in a
    page object whose `next_cursor` is `null` on the last page. Clients pass `next_cursor` back
    unchanged; a malformed or expired cursor returns `INVALID_CURSOR`. List operations reuse the
    `Cursor` and `Limit` parameters and build their response schema with `allOf` over `Page`.

    ## Rate limits

    60 requests per minute per authenticated user, and per client IP for unauthenticated
    requests. Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset`. Going over the limit returns `429` with `RATE_LIMITED` and a `Retry-After`
    header in seconds.
  contact:
    name: arquitecto (contract owner)
    url: https://github.com/UriZaltzman/padel-camaras-ia
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-rate-limit:
    requests: 60
    window_seconds: 60
    scope: user

servers:
  - url: /v1
    description: Same host as the client. Each environment serves the API under `/v1`.

security:
  - bearerAuth: []

tags:
  - name: System
    description: Liveness and operational endpoints.
  - name: Auth
    description: Sign-in with a WhatsApp code, Google or Apple, and session renewal.
  - name: Users
    description: The signed-in user's profile, matches, stats and account deletion.
  - name: Clubs
    description: Clubs, their courts and booking rules, and the owner's club settings.

# Every operation must:
# - document `429` and reference `components/responses` for every 4xx and 5xx response;
# - reuse `Cursor` and `Limit` when it returns a list.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness probe
      description: |
        The process is up and serving. It does not check the database or Redis yet. No
        credentials needed.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/whatsapp:
    post:
      operationId: requestWhatsappOtp
      tags: [Auth]
      summary: Send a sign-in code by WhatsApp
      description: |
        Sends a 6-digit code to the phone by WhatsApp. The code is valid for 5 minutes and allows
        5 attempts. Asking again replaces the previous code. The response is the same whether or
        not the phone has an account, so it does not reveal who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phone: '+5491155550123'
      responses:
        '202':
          description: The code was sent (or queued for sending).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                expires_in_seconds: 300
                resend_after_seconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/verify:
    post:
      operationId: verifyWhatsappOtp
      tags: [Auth]
      summary: Sign in with the WhatsApp code
      description: |
        Checks the code and returns a session. If the phone has no account yet, one is created;
        `consent` is then required, otherwise the answer is `403 TERMS_NOT_ACCEPTED` and the
        code stays valid so the app can retry with consent. For existing accounts `consent` is
        ignored.

        Errors: `OTP_INVALID` (with `attempts_remaining`), `OTP_EXPIRED`,
        `OTP_ATTEMPTS_EXCEEDED`, `TERMS_NOT_ACCEPTED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            examples:
              sign_up:
                summary: New account, accepting terms and privacy
                value:
                  phone: '+5491155550123'
                  code: '482913'
                  consent:
                    terms_version: '2026-10-01'
                    privacy_version: '2026-10-01'
              sign_in:
                summary: Existing account
                value:
                  phone: '+5491155550123'
                  code: '482913'
      responses:
        '200':
          description: Signed in. `is_new_user` tells the app whether to show onboarding.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/google:
    post:
      operationId: signInWithGoogle
      tags: [Auth]
      summary: Sign in with Google
      description: |
        Exchanges a Google ID token (obtained by the app or web with the Google SDK) for a
        session. The server verifies signature, audience and expiry. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthSignInRequest'
            example:
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
              nonce: 3f9c2a7b1e
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/apple:
    post:
      operationId: signInWithApple
      tags: [Auth]
      summary: Sign in with Apple
      description: |
        Exchanges an Apple identity token for a session. Apple sends the user's name only on the
        first authorization, so the app forwards it in `full_name` that time. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
            example:
              id_token: eyJraWQiOiJXNldjT0tCIiwiYWxnIjoiUlMyNTYifQ...
              nonce: 8d1e4b6a0c
              full_name: Sofía Pérez
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renew the session
      description: |
        Exchanges a refresh token (valid 30 days) for a new access token (15 minutes) and a new
        refresh token. The old refresh token is revoked on use; presenting it again returns
        `REFRESH_TOKEN_INVALID` and revokes the whole token family (reuse detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5b.Zx8kQ2
      responses:
        '200':
          description: New token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIwMTky...
                refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5c.Yp3nR7
                token_type: Bearer
                expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get the signed-in user's profile
      description: The full own profile, including the consents and the training preference.
      responses:
        '200':
          description: The profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                player:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateMe
      tags: [Users]
      summary: Update the signed-in user's profile and preferences
      description: |
        Partial update: only the fields present change; `null` clears an optional field. Phone
        and email are not editable here (they come from the sign-in identities).
        `training_opt_out: true` excludes the user's videos from AI training (section 12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
            example:
              display_name: Sofi Pérez
              declared_category: '6'
              playing_side: drive
              training_opt_out: true
      responses:
        '200':
          description: The updated profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                player:
                  $ref: '#/components/examples/UserExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMe
      tags: [Users]
      summary: Delete the signed-in user's account
      description: |
        Revokes every session at once and schedules the deletion of the profile, stats and own
        clips within 30 days (Ley 25.326). Full match videos are deleted after 30 days anyway.
        Idempotent: calling it again returns the same scheduled date.
      responses:
        '202':
          description: Deletion scheduled.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
              example:
                deletion_scheduled_for: '2026-11-16T21:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/matches:
    get:
      operationId: listMyMatches
      tags: [Users]
      summary: List the signed-in user's matches
      description: Matches where the user is a confirmed player, newest first.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          required: false
          description: Only matches in this status.
          schema:
            $ref: '#/components/schemas/MatchStatus'
      responses:
        '200':
          description: One page of matches.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSummaryPage'
              example:
                items:
                  - id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
                    type: match
                    status: published
                    starts_at: '2026-10-15T22:00:00Z'
                    ends_at: '2026-10-15T23:30:00Z'
                    club:
                      id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a60
                      name: Pádel Norte
                    court:
                      id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a61
                      name: Cancha 2
                    team: 1
                    won: true
                    sets:
                      - team_1: 6
                        team_2: 4
                      - team_1: 7
                        team_2: 5
                next_cursor: eyJzdGFydHNfYXQiOiIyMDI2LTEwLTE1In0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/stats:
    get:
      operationId: getMyStats
      tags: [Users]
      summary: Get the signed-in user's aggregate stats
      description: Totals over the user's published matches. Lessons do not count.
      responses:
        '200':
          description: The stats.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
              example:
                matches_played: 24
                matches_won: 14
                sets_won: 31
                sets_lost: 22
                points_won: 812
                points_played: 1530
                rating: 4.35
                last_match_at: '2026-10-15T23:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs:
    get:
      operationId: listClubs
      tags: [Clubs]
      summary: List clubs
      description: |
        Active clubs on the platform, ordered by name. Public: no credentials needed, so the web
        and the app can show clubs before sign-in. Returns no personal data and no private
        settings (CUIT, Mercado Pago account, contract terms).
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: Case- and accent-insensitive search on the club name or city.
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        '200':
          description: One page of clubs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubSummaryPage'
              example:
                items:
                  - id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a60
                    name: Club Demo Palermo
                    address: Av. Santa Fe 4000
                    city: CABA
                    logo_url: null
                    courts_count: 4
                next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [Clubs]
      summary: Get a club with its courts, booking rules and charge settings
      description: |
        Public detail of a club: courts with their booking rules (days, hours, durations,
        prices, deposit, cancellation) and the charge settings players need to know (whether
        there is a per-match extra and its price). No credentials needed. A club that is not
        active returns `404 NOT_FOUND`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClubId'
      responses:
        '200':
          description: The club.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              examples:
                palermo:
                  $ref: '#/components/examples/ClubExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{id}/settings:
    patch:
      operationId: updateClubSettings
      tags: [Clubs]
      summary: Update the club's booking rules and charge settings (owner only)
      description: |
        **Only the club owner** (an active `memberships` row with `role = owner` in this club,
        section 12) may call it. Staff, coaches and players of the club get `403 FORBIDDEN`; a
        user with no membership in the club gets `404 NOT_FOUND`, so the endpoint does not
        reveal which clubs exist behind it. Every change is written to `audit_log`.

        Partial update at the top level: `charges` and each listed court's `booking` replace
        the current value as a whole; courts not listed keep their rules. Changes apply to
        bookings created afterwards, never to existing ones. The plan (`loan` or `purchase`)
        is part of the contract with us and is read-only here.

        Errors: `VALIDATION_FAILED` with `details.issues`, both for schema errors and for fields
        valid one by one but not together (overlapping rules, price bands with gaps or a missing
        allowed duration, an enabled extra without a price, a monthly coach plan without a fee);
        `NOT_FOUND` (club, or a `court_id` of another club); `FORBIDDEN` (not the owner).
      x-required-role: owner
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubSettingsUpdate'
            examples:
              charge_players:
                summary: Start charging players an extra per match
                value:
                  charges:
                    player_extra:
                      enabled: true
                      amount_cents: 300000
                    coach_plan:
                      type: included
                    lesson_payments_enabled: true
              court_rules:
                summary: Replace the booking rules of one court
                value:
                  courts:
                    - court_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a61
                      booking:
                        rules:
                          - days: [mon, tue, wed, thu, fri]
                            opens_at: '08:00'
                            closes_at: '24:00'
                            allowed_durations: [60, 90, 120]
                            start_interval_minutes: 30
                            price_bands:
                              - starts_at: '08:00'
                                ends_at: '18:00'
                                prices:
                                  - duration_minutes: 60
                                    amount_cents: 1600000
                                  - duration_minutes: 90
                                    amount_cents: 2400000
                                  - duration_minutes: 120
                                    amount_cents: 3200000
                              - starts_at: '18:00'
                                ends_at: '24:00'
                                prices:
                                  - duration_minutes: 60
                                    amount_cents: 2000000
                                  - duration_minutes: 90
                                    amount_cents: 3000000
                                  - duration_minutes: 120
                                    amount_cents: 4000000
                        deposit:
                          type: percent
                          percent: 30
                        cancellation_refund_hours: 24
      responses:
        '200':
          description: The club with the new settings.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              examples:
                palermo:
                  $ref: '#/components/examples/ClubExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token valid for 15 minutes, renewed with a rotating refresh token.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`. Omit it for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

    ClubId:
      name: id
      in: path
      required: true
      description: Club id.
      schema:
        $ref: '#/components/schemas/Uuid'

  headers:
    X-Request-Id:
      description: Unique id of the request, also present in the structured logs.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed in the current window (60).
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID v7.
      examples:
        - 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
      examples:
        - '2026-10-17T21:30:00Z'
    AmountCents:
      type: integer
      minimum: 0
      description: Amount in ARS cents. Never decimals.
      examples:
        - 1500000

    # State machines (section 3 of the specification). Each status schema carries its allowed
    # transitions in `x-state-machine`: `transitions` lists, for every state, the states it may
    # move to (an empty list is a final state). This is the single source of the transition
    # tables; `pnpm contracts:generate` exports them to TypeScript and Python. The backend rejects
    # any other change with `INVALID_STATE_TRANSITION`.
    MatchStatus:
      type: string
      description: |
        Status of a match (`matches.status`). Recording and analysis move it forward; a score
        correction sends it to `needs_review`, and after 30 days the full video is deleted and it
        is `archived`.
      enum:
        - scheduled
        - recording
        - recorded
        - processing
        - published
        - needs_review
        - archived
        - failed
        - cancelled
      x-state-machine:
        column: matches.status
        initial: scheduled
        transitions:
          scheduled: [recording, cancelled]
          recording: [recorded]
          recorded: [processing]
          processing: [published, failed]
          published: [needs_review, archived]
          needs_review: [published]
          archived: []
          failed: [processing]
          cancelled: []

    BookingStatus:
      type: string
      description: |
        Status of a booking (`bookings.status`). A new booking is `held` for 10 minutes while the
        deposit is paid; if it is not paid in time it is `expired` and the slot is released.
      enum:
        - held
        - confirmed
        - completed
        - cancelled
        - no_show
        - expired
      x-state-machine:
        column: bookings.status
        initial: held
        transitions:
          held: [confirmed, expired]
          confirmed: [completed, cancelled, no_show]
          completed: []
          cancelled: []
          no_show: []
          expired: []

    ProcessingJobStatus:
      type: string
      description: |
        Status of an analysis job (`processing_jobs.status`). The job also stores its pipeline
        stage, so it resumes from there after a power cut.
      enum:
        - queued
        - running
        - succeeded
        - failed
      x-state-machine:
        column: processing_jobs.status
        initial: queued
        transitions:
          queued: [running]
          running: [succeeded, failed]
          succeeded: []
          failed: []

    PaymentStatus:
      type: string
      description: |
        Status of a payment (`payments.status`). Only the Mercado Pago webhook changes it, never
        the app.
      enum:
        - pending
        - approved
        - rejected
        - refunded
      x-state-machine:
        column: payments.status
        initial: pending
        transitions:
          pending: [approved, rejected]
          approved: [refunded]
          rejected: []
          refunded: []

    SettlementStatus:
      type: string
      description: |
        Status of a monthly settlement (`settlements.status`). It is drafted on the 1st of each
        month, approved by the team, invoiced and then paid.
      enum:
        - draft
        - approved
        - invoiced
        - paid
      x-state-machine:
        column: settlements.status
        initial: draft
        transitions:
          draft: [approved]
          approved: [invoiced]
          invoiced: [paid]
          paid: []

    HealthStatus:
      type: object
      description: Liveness result.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    PhoneNumber:
      type: string
      description: Phone in E.164 format, with country code (WhatsApp number).
      pattern: '^\+[1-9][0-9]{7,14}$'
      examples:
        - '+5491155550123'

    SignUpConsent:
      type: object
      description: |
        Acceptance of the terms and the privacy policy (Ley 25.326), required to create an
        account. Sending it means the user accepted the given versions; the server stores the
        versions and the time.
      required: [terms_version, privacy_version]
      properties:
        terms_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the terms the user saw, e.g. `2026-10-01`.
        privacy_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the privacy policy the user saw.

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'

    OtpChallenge:
      type: object
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds:
          type: integer
          minimum: 0
          description: Seconds until the code expires (300).
        resend_after_seconds:
          type: integer
          minimum: 0
          description: Seconds before the app may ask for a new code.

    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6-digit code received by WhatsApp.
        consent:
          $ref: '#/components/schemas/SignUpConsent'

    OAuthSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: ID token issued by the provider to this app.
        nonce:
          type: string
          minLength: 1
          maxLength: 256
          description: Raw nonce used when asking for the token, checked against its `nonce` claim.
        consent:
          $ref: '#/components/schemas/SignUpConsent'

    AppleSignInRequest:
      allOf:
        - $ref: '#/components/schemas/OAuthSignInRequest'
        - type: object
          properties:
            full_name:
              type: string
              minLength: 1
              maxLength: 120
              description: Name Apple sent on the first authorization only.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT for the `Authorization` header. Valid for 15 minutes.
        refresh_token:
          type: string
          description: Opaque, single-use token valid for 30 days. Store it securely.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the access token expires (900).

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, is_new_user]
          properties:
            user:
              $ref: '#/components/schemas/User'
            is_new_user:
              type: boolean
              description: True when this request created the account.

    DeclaredCategory:
      type: string
      description: Self-declared Argentine padel category, from 8va (`8`) to 1ra (`1`).
      enum: ['1', '2', '3', '4', '5', '6', '7', '8']

    DominantHand:
      type: string
      enum: [right, left]

    PlayingSide:
      type: string
      description: Preferred side of the court. `drive` is the right side, `reves` the left.
      enum: [drive, reves, both]

    User:
      type: object
      description: The signed-in user's own profile. Only the owner sees phone, email and birth date.
      required:
        - id
        - display_name
        - phone
        - email
        - photo_url
        - declared_category
        - dominant_hand
        - playing_side
        - birth_date
        - training_opt_out
        - terms_version
        - terms_accepted_at
        - privacy_version
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type:
            - string
            - 'null'
          description: Verified WhatsApp phone in E.164, or `null` if the user signed in only with Google or Apple.
        email:
          type:
            - string
            - 'null'
          maxLength: 254
          description: |
            Email from Google or Apple, or `null`. Plain string on purpose (no `format: email`), so
            the Python models do not need `email-validator`.
        photo_url:
          type:
            - string
            - 'null'
          format: uri
        declared_category:
          oneOf:
            - $ref: '#/components/schemas/DeclaredCategory'
            - type: 'null'
        dominant_hand:
          oneOf:
            - $ref: '#/components/schemas/DominantHand'
            - type: 'null'
        playing_side:
          oneOf:
            - $ref: '#/components/schemas/PlayingSide'
            - type: 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
          description: Used to apply the minors rule (no recording without a guardian's permission).
        training_opt_out:
          type: boolean
          description: True when the user asked that their videos not be used to train the AI.
        terms_version:
          type: string
          description: Version of the terms the user accepted.
        terms_accepted_at:
          $ref: '#/components/schemas/Timestamp'
        privacy_version:
          type: string
          description: Version of the privacy policy the user accepted.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    UserUpdate:
      type: object
      description: Fields of `User` the owner may change. At least one is required.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        photo_url:
          type:
            - string
            - 'null'
          format: uri
        declared_category:
          oneOf:
            - $ref: '#/components/schemas/DeclaredCategory'
            - type: 'null'
        dominant_hand:
          oneOf:
            - $ref: '#/components/schemas/DominantHand'
            - type: 'null'
        playing_side:
          oneOf:
            - $ref: '#/components/schemas/PlayingSide'
            - type: 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
        training_opt_out:
          type: boolean

    AccountDeletion:
      type: object
      required: [deletion_scheduled_for]
      properties:
        deletion_scheduled_for:
          $ref: '#/components/schemas/Timestamp'

    EntityRef:
      type: object
      description: Id and display name of a related entity.
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    SetScore:
      type: object
      description: Games won by each team in one set.
      required: [team_1, team_2]
      properties:
        team_1:
          type: integer
          minimum: 0
        team_2:
          type: integer
          minimum: 0

    MatchSummary:
      type: object
      description: A match in the user's list, seen from that user's side.
      required: [id, type, status, starts_at, ends_at, club, court, team, won, sets]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [match, lesson]
        status:
          $ref: '#/components/schemas/MatchStatus'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        club:
          $ref: '#/components/schemas/EntityRef'
        court:
          $ref: '#/components/schemas/EntityRef'
        team:
          type:
            - integer
            - 'null'
          enum: [1, 2, null]
          description: The user's team, or `null` while not assigned.
        won:
          type:
            - boolean
            - 'null'
          description: Whether the user's team won, or `null` until the match is published.
        sets:
          type: array
          description: Final score per set; empty until the match is published.
          items:
            $ref: '#/components/schemas/SetScore'

    MatchSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatchSummary'

    UserStats:
      type: object
      description: Aggregate stats over the user's published matches.
      required:
        - matches_played
        - matches_won
        - sets_won
        - sets_lost
        - points_won
        - points_played
        - rating
        - last_match_at
      properties:
        matches_played:
          type: integer
          minimum: 0
        matches_won:
          type: integer
          minimum: 0
        sets_won:
          type: integer
          minimum: 0
        sets_lost:
          type: integer
          minimum: 0
        points_won:
          type: integer
          minimum: 0
        points_played:
          type: integer
          minimum: 0
        rating:
          type:
            - number
            - 'null'
          description: Current level estimate, or `null` until enough matches are published.
        last_match_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ClubPlan:
      type: string
      description: |
        How the club got the camera kit: `loan` (comodato, we keep ownership) or `purchase`.
        Set by the contract with us; read-only for the club.
      enum: [loan, purchase]

    ClubSummary:
      type: object
      description: A club in the public list.
      required: [id, name, address, city, logo_url, courts_count]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 80
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        courts_count:
          type: integer
          minimum: 0

    ClubSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClubSummary'

    Club:
      type: object
      description: Public detail of a club with its courts and settings.
      required:
        - id
        - name
        - address
        - city
        - timezone
        - logo_url
        - sponsor_name
        - plan
        - courts
        - charges
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 80
        timezone:
          type: string
          description: IANA time zone of the club. Booking rule hours are local times in this zone.
          examples:
            - America/Argentina/Buenos_Aires
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        sponsor_name:
          type:
            - string
            - 'null'
          maxLength: 120
        plan:
          $ref: '#/components/schemas/ClubPlan'
        courts:
          type: array
          items:
            $ref: '#/components/schemas/Court'
        charges:
          $ref: '#/components/schemas/ChargeSettings'

    CourtStatus:
      type: string
      description: |
        `active` takes bookings; `maintenance` is temporarily closed (no new bookings);
        `inactive` is out of service.
      enum: [active, maintenance, inactive]

    Court:
      type: object
      required: [id, name, covered, status, booking]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 60
        covered:
          type: boolean
          description: True for an indoor (techada) court.
        status:
          $ref: '#/components/schemas/CourtStatus'
        booking:
          $ref: '#/components/schemas/CourtBookingSettings'

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    LocalTime:
      type: string
      description: |
        Local time `HH:MM` in the club's time zone. `24:00` is allowed as an end time and means
        midnight at the end of the day.
      pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
      examples:
        - '18:00'

    BookingDuration:
      type: integer
      description: Allowed booking length in minutes.
      enum: [60, 90, 120]

    DurationPrice:
      type: object
      required: [duration_minutes, amount_cents]
      properties:
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'

    PriceBand:
      type: object
      description: |
        Price of a booking that starts in `[starts_at, ends_at)`, for example peak hours from
        18:00 to 23:00. The bands of a rule must cover its opening hours without gaps or
        overlaps, and have a price for every allowed duration.
      required: [starts_at, ends_at, prices]
      properties:
        starts_at:
          $ref: '#/components/schemas/LocalTime'
        ends_at:
          $ref: '#/components/schemas/LocalTime'
        prices:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/DurationPrice'

    BookingRule:
      type: object
      description: |
        Opening hours of a court on some weekdays (`booking_slots_rules`). A booking must start
        on a step of `start_interval_minutes` from `opens_at` and end by `closes_at`. Rules of
        one court must not overlap on the same day.
      required: [days, opens_at, closes_at, allowed_durations, start_interval_minutes, price_bands]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        opens_at:
          $ref: '#/components/schemas/LocalTime'
        closes_at:
          $ref: '#/components/schemas/LocalTime'
        allowed_durations:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingDuration'
        start_interval_minutes:
          type: integer
          enum: [15, 30, 60]
          default: 30
          description: Every how many minutes a booking may start (30 by default).
        price_bands:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/PriceBand'

    DepositNone:
      type: object
      description: No deposit; the booking is confirmed right away.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [none]

    DepositPercent:
      type: object
      description: Deposit as a percent of the booking price, rounded down to whole cents.
      required: [type, percent]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [percent]
        percent:
          type: integer
          minimum: 1
          maximum: 100

    DepositFixed:
      type: object
      description: Fixed deposit amount in ARS cents, capped at the booking price.
      required: [type, amount_cents]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [fixed]
        amount_cents:
          type: integer
          minimum: 1

    Deposit:
      description: Deposit asked to confirm a booking, paid with Mercado Pago (section 9).
      oneOf:
        - $ref: '#/components/schemas/DepositNone'
        - $ref: '#/components/schemas/DepositPercent'
        - $ref: '#/components/schemas/DepositFixed'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/DepositNone'
          percent: '#/components/schemas/DepositPercent'
          fixed: '#/components/schemas/DepositFixed'

    CourtBookingSettings:
      type: object
      description: Booking rules, deposit and cancellation policy of one court.
      required: [rules, deposit, cancellation_refund_hours]
      additionalProperties: false
      properties:
        rules:
          type: array
          description: Empty means the court takes no bookings from the app.
          maxItems: 14
          items:
            $ref: '#/components/schemas/BookingRule'
        deposit:
          $ref: '#/components/schemas/Deposit'
        cancellation_refund_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: |
            Cancelling at least this many hours before the start refunds the deposit (24 by
            default). Later cancellations and `no_show` keep it.

    PlayerExtraSettings:
      type: object
      description: |
        Per-match extra charged to each player to unlock the full analysis (`player_extra`
        payments). The money goes to the club's Mercado Pago account.
      required: [enabled, amount_cents]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False means everything is free for players.
        amount_cents:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Price per player and match in ARS cents. Required when `enabled` is true.

    CoachPlan:
      type: object
      description: |
        Who pays for the coach tools: `included` in the club's subscription, or
        `coach_monthly`, a monthly fee each coach pays.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [included, coach_monthly]
        monthly_fee_cents:
          type: integer
          minimum: 1
          description: Monthly fee per coach in ARS cents. Required when `type` is `coach_monthly`.

    ChargeSettings:
      type: object
      description: How the club charges players and coaches (section 10).
      required: [player_extra, coach_plan, lesson_payments_enabled]
      additionalProperties: false
      properties:
        player_extra:
          $ref: '#/components/schemas/PlayerExtraSettings'
        coach_plan:
          $ref: '#/components/schemas/CoachPlan'
        lesson_payments_enabled:
          type: boolean
          description: True lets the club's coaches charge their lessons in the app (`lesson` payments).

    CourtSettingsUpdate:
      type: object
      required: [court_id, booking]
      additionalProperties: false
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        booking:
          $ref: '#/components/schemas/CourtBookingSettings'

    ClubSettingsUpdate:
      type: object
      description: Settings the owner may change. At least one field is required.
      minProperties: 1
      additionalProperties: false
      properties:
        charges:
          $ref: '#/components/schemas/ChargeSettings'
        courts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CourtSettingsUpdate'

    Page:
      type: object
      description: |
        Base of every paginated response. A list operation combines it with `allOf` and adds an
        `items` array of its own type.
      required:
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: Cursor for the next page, or `null` on the last page.

    Error:
      type: object
      description: Body of every 4xx and 5xx response.
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Short text for the end user, in es-AR, from the API translation files.
        details:
          type: object
          additionalProperties: true
          description: Optional machine-readable detail. Shape per code in the `ErrorCode` catalog.
      examples:
        - code: BOOKING_SLOT_TAKEN
          message: Ese turno se acaba de ocupar. Elegí otro horario.
          details:
            court_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
            starts_at: '2026-10-17T21:30:00Z'

    ValidationIssue:
      type: object
      description: One invalid field, used in `details.issues` of `VALIDATION_FAILED`.
      required:
        - path
        - rule
      properties:
        path:
          type: string
          description: JSON pointer or parameter name of the invalid value, e.g. `/players/0/phone`.
        rule:
          type: string
          description: Machine-readable rule that failed, e.g. `required`, `max`, `format`.

    ErrorCode:
      type: string
      description: |
        Stable error codes. The catalog in `x-error-catalog` gives the HTTP status, the meaning
        and the `details` shape of each one. Codes are only added, never renamed or reused.
      pattern: '^[A-Z][A-Z0-9_]*$'
      enum:
        # Common
        - VALIDATION_FAILED
        - INVALID_CURSOR
        - UNAUTHENTICATED
        - ACCESS_TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        # Auth and users
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_ATTEMPTS_EXCEEDED
        - REFRESH_TOKEN_INVALID
        - TERMS_NOT_ACCEPTED
        # Clubs
        - CLUB_FEATURE_DISABLED
        - CLUB_SERVICE_SUSPENDED
        # Bookings
        - BOOKING_SLOT_TAKEN
        - BOOKING_SLOT_INVALID
        - BOOKING_HOLD_EXPIRED
        - BOOKING_FULL
        - BOOKING_INVITE_INVALID
        # Matches and media
        - MATCH_NOT_PUBLISHED
        - MATCH_PLAYER_SLOT_TAKEN
        - MATCH_ALREADY_JOINED
        - MEDIA_NOT_READY
        - MEDIA_EXPIRED
        # Coaches
        - COACH_ACCESS_NOT_GRANTED
        # Payments
        - PAYMENT_PROVIDER_ERROR
        - WEBHOOK_SIGNATURE_INVALID
        # Club panel and device
        - RECORDING_NOT_ACTIVE
        - DEVICE_CERTIFICATE_INVALID
        - DEVICE_CLUB_MISMATCH
      x-error-catalog:
        - code: VALIDATION_FAILED
          http_status: 400
          description: The request is malformed or a field breaks its schema (Zod at the edge).
          details: '`issues`: array of `ValidationIssue`.'
        - code: INVALID_CURSOR
          http_status: 400
          description: The pagination cursor is malformed, expired or from another list.
        - code: UNAUTHENTICATED
          http_status: 401
          description: No access token, or the token is not valid.
        - code: ACCESS_TOKEN_EXPIRED
          http_status: 401
          description: The access token expired. Renew it with the refresh token and retry.
        - code: FORBIDDEN
          http_status: 403
          description: The caller's role does not allow this action (section 12 permissions).
        - code: NOT_FOUND
          http_status: 404
          description: The resource does not exist or belongs to another club.
          details: '`resource`: resource type, e.g. `booking`.'
        - code: INVALID_STATE_TRANSITION
          http_status: 409
          description: The entity cannot move to the requested status from its current one.
          details: '`entity`, `from` and `to` statuses.'
        - code: RATE_LIMITED
          http_status: 429
          description: More than 60 requests per minute. Wait for `Retry-After` seconds.
        - code: INTERNAL_ERROR
          http_status: 500
          description: Unexpected server error. The detail is in the log under `X-Request-Id`.
        - code: SERVICE_UNAVAILABLE
          http_status: 503
          description: The API or a dependency is temporarily down. Safe to retry later.
        - code: OTP_INVALID
          http_status: 401
          description: The WhatsApp code is wrong.
          details: '`attempts_remaining`: integer.'
        - code: OTP_EXPIRED
          http_status: 401
          description: The WhatsApp code is older than 5 minutes. Request a new one.
        - code: OTP_ATTEMPTS_EXCEEDED
          http_status: 401
          description: Five wrong attempts for this code. Request a new one.
        - code: REFRESH_TOKEN_INVALID
          http_status: 401
          description: The refresh token is expired, revoked or was already used. Sign in again.
        - code: TERMS_NOT_ACCEPTED
          http_status: 403
          description: The user has not accepted the terms and privacy policy (Ley 25.326).
        - code: CLUB_FEATURE_DISABLED
          http_status: 403
          description: The club has not enabled this feature or paid extra.
          details: '`feature`: feature key.'
        - code: CLUB_SERVICE_SUSPENDED
          http_status: 403
          description: The club's service is cut for 30 days of unpaid subscription.
        - code: BOOKING_SLOT_TAKEN
          http_status: 409
          description: Another held or confirmed booking overlaps the slot (exclusion constraint).
          details: '`court_id`, `starts_at`.'
        - code: BOOKING_SLOT_INVALID
          http_status: 422
          description: The slot breaks the court rules (opening hours, duration or start step).
        - code: BOOKING_HOLD_EXPIRED
          http_status: 409
          description: The 10-minute hold expired before the deposit was paid; the slot was released.
        - code: BOOKING_FULL
          http_status: 409
          description: The booking already has its 4 players.
        - code: BOOKING_INVITE_INVALID
          http_status: 422
          description: The invite link is invalid, already used or the booking is no longer active.
        - code: MATCH_NOT_PUBLISHED
          http_status: 409
          description: The action needs a published match (clips, score correction, downloads).
        - code: MATCH_PLAYER_SLOT_TAKEN
          http_status: 409
          description: Another user already claimed that player position in the match.
        - code: MATCH_ALREADY_JOINED
          http_status: 409
          description: The user is already a player in this match.
        - code: MEDIA_NOT_READY
          http_status: 409
          description: The video or clip is still being processed or uploaded.
        - code: MEDIA_EXPIRED
          http_status: 410
          description: The media was deleted (full videos are deleted after 30 days).
        - code: COACH_ACCESS_NOT_GRANTED
          http_status: 403
          description: The student has not given this coach access to their matches or lessons.
        - code: PAYMENT_PROVIDER_ERROR
          http_status: 502
          description: Mercado Pago failed or rejected the request. Safe to retry later.
        - code: WEBHOOK_SIGNATURE_INVALID
          http_status: 401
          description: The Mercado Pago webhook `x-signature` does not verify.
        - code: RECORDING_NOT_ACTIVE
          http_status: 409
          description: The court is not recording, so there is nothing to stop.
        - code: DEVICE_CERTIFICATE_INVALID
          http_status: 401
          description: The club device client certificate is missing, expired or revoked (mTLS).
        - code: DEVICE_CLUB_MISMATCH
          http_status: 403
          description: The device tried to act on a match, court or upload of another club.

