      responses:
        '200':
          description: One page of events.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditEventPage'
        '400':
