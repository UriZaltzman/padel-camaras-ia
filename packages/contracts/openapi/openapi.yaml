  /clubs/{id}/tournaments/{tournament_id}/registrations:
    post:
      operationId: registerTournamentPair
      tags: [Tournaments]
      summary: Register a pair (CL-08)
      description: |
        The caller registers themselves with `partner_user_id`. Closed once the draw is made. A player
        can be in one active pair per tournament. If the tournament has an entry fee the pair stays
