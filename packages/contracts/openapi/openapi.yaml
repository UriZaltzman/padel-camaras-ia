        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{id}/tournaments:
    get:
      operationId: listTournaments
      tags: [Tournaments]
      summary: Tournaments of the club (CL-08)
      description: |
        Tournaments of the club, newest first. Open to anyone with an active role in the club or who
        played a confirmed match there (others get `NOT_FOUND`). Errors: `CLUB_FEATURE_DISABLED` (the
        club has the `tournaments` module off).
      parameters:
