  /clubs/{id}/tournaments/{tournament_id}/registrations/{registration_id}/payment:
    put:
      operationId: markTournamentPairPaid
      tags: [Tournaments]
      summary: Mark the entry fee as collected (CL-08, staff and owner)
      description: |
        For fees collected at the club. Idempotent. Errors: `FORBIDDEN`, `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentRegistrationId'
      responses:
        '200':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
