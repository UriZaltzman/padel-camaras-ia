      summary: Create a tournament (CL-08, staff and owner)
      description: |
        Opens registration for a tournament of one category (1st to 6th). `points` defaults to
        champion 100, finalist 60, semifinal 36, quarterfinals 18 and 5 per group win; the club may
        change them. `entry_fee_cents` 0 means free. Errors: `FORBIDDEN`, `CLUB_FEATURE_DISABLED`,
        `VALIDATION_FAILED`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
      requestBody:
        required: true
        content:
          application/json:
