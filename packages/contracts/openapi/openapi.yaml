    delete:
      operationId: withdrawTournamentPair
      tags: [Tournaments]
      summary: Withdraw a pair (CL-08)
      description: |
        One of the two players, or the club's staff, withdraws the pair while registration is open.
        Errors: `TOURNAMENT_REGISTRATION_CLOSED`, `FORBIDDEN`, `NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentRegistrationId'
      responses:
        '204':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
