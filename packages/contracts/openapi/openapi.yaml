  /clubs/{id}/tournaments/{tournament_id}/matches/{match_id}/result:
    put:
      operationId: reportTournamentResult
      tags: [Tournaments]
      summary: Enter the result of a match (CL-08)
      description: |
        A player of either pair enters the score (`team_1` is pair A); the match waits for the rival
        pair to confirm. Entering again replaces a result nobody confirmed yet. Staff and owner enter
        it already confirmed. Errors: `FORBIDDEN`, `NOT_FOUND`, `INVALID_STATE_TRANSITION` (already
        confirmed, or the pairs are not known yet), `VALIDATION_FAILED` (impossible score).
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentMatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentResult'
      responses:
        '200':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{id}/tournaments/{tournament_id}/matches/{match_id}/result/confirmation:
    put:
      operationId: confirmTournamentResult
      tags: [Tournaments]
      summary: Confirm the result as the rival (CL-08)
      description: |
        A player of the pair that did not enter the result confirms it. The winner moves to the next
        round; when the final is confirmed the tournament finishes and the ranking points are awarded.
        Errors: `FORBIDDEN` (not the rival), `NOT_FOUND`, `INVALID_STATE_TRANSITION`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TournamentId'
        - $ref: '#/components/parameters/TournamentMatchId'
      responses:
        '200':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /clubs/{id}/tournament-ranking:
    get:
      operationId: getTournamentRanking
      tags: [Tournaments]
      summary: Tournament ranking of a category, last 12 months (CL-08)
      description: |
        Sum of the points a player earned in the club's tournaments of the category over the last 12
        months, best first. Same access as the list. Errors: `CLUB_FEATURE_DISABLED`.
      parameters:
        - $ref: '#/components/parameters/ClubId'
        - $ref: '#/components/parameters/TournamentCategoryQuery'
      responses:
        '200':
          description: Done.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentRanking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    deviceMtls:
      type: mutualTLS
      description: |
        Club device client certificate (section 12), issued per device by our CA and distinct
        from any user. The TLS terminator verifies it and forwards the certificate fingerprint;
        the API maps it to the device and its club. A missing, expired or revoked certificate
        returns `DEVICE_CERTIFICATE_INVALID`; acting on another club returns
        `DEVICE_CLUB_MISMATCH`. Device endpoints never accept a bearer token.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token valid for 15 minutes, renewed with a rotating refresh token.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`. Omit it for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

    TournamentId:
      name: tournament_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TournamentMatchId:
      name: match_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TournamentRegistrationId:
      name: registration_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TournamentCategoryQuery:
      name: category
      in: query
      required: true
      description: Tournament category, 1 (top) to 6.
      schema:
        $ref: '#/components/schemas/TournamentCategory'
    ClubPlayerUserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ClubIdQuery:
      name: club_id
      in: query
      required: true
      description: Club the panel acts on. The caller must be staff or owner of it.
      schema:
        $ref: '#/components/schemas/Uuid'
    ClubId:
      name: id
      in: path
      required: true
      description: Club id.
      schema:
        $ref: '#/components/schemas/Uuid'

    LessonId:
      name: id
      in: path
      required: true
      description: Lesson id.
      schema:
        $ref: '#/components/schemas/Uuid'
    LessonRequestId:
      name: id
      in: path
      required: true
      description: Lesson request id.
      schema:
        $ref: '#/components/schemas/Uuid'
    CourtId:
      name: id
      in: path
      required: true
      description: Court id.
      schema:
        $ref: '#/components/schemas/Uuid'

    DeviceMatchId:
      name: id
      in: path
      required: true
      description: Match id (must belong to the device's club).
      schema:
        $ref: '#/components/schemas/Uuid'

    DeviceUploadId:
      name: id
      in: path
      required: true
      description: Upload id from `POST /device/uploads`.
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: id
      in: path
      required: true
      description: Booking id.
      schema:
        $ref: '#/components/schemas/Uuid'

    MatchId:
      name: id
      in: path
      required: true
      description: Match id.
      schema:
        $ref: '#/components/schemas/Uuid'

    MediaId:
      name: id
      in: path
      required: true
      description: Media asset id (video, clip, reel or thumbnail).
      schema:
        $ref: '#/components/schemas/Uuid'
  headers:
    X-Request-Id:
      description: Unique id of the request, also present in the structured logs.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed in the current window (60).
      schema:
        type: integer
        minimum: 0
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
    RateLimit-Reset:
      description: Seconds until the current window resets.
      schema:
        type: integer
        minimum: 0
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID v7.
      examples:
        - 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp in UTC.
      examples:
        - '2026-10-17T21:30:00Z'
    AmountCents:
      type: integer
      minimum: 0
      description: Amount in ARS cents. Never decimals.
      examples:
        - 1500000

    # State machines (section 3 of the specification). Each status schema carries its allowed
    # transitions in `x-state-machine`: `transitions` lists, for every state, the states it may
    # move to (an empty list is a final state). This is the single source of the transition
    # tables; `pnpm contracts:generate` exports them to TypeScript and Python. The backend rejects
    # any other change with `INVALID_STATE_TRANSITION`.
    MatchStatus:
      type: string
      description: |
        Status of a match (`matches.status`). Recording and analysis move it forward; a score
        correction sends it to `needs_review`, and after 30 days the full video is deleted and it
        is `archived`.
      enum:
        - scheduled
        - recording
        - recorded
        - processing
        - published
        - needs_review
        - archived
        - failed
        - cancelled
      x-state-machine:
        column: matches.status
        initial: scheduled
        transitions:
          scheduled: [recording, cancelled]
          recording: [recorded]
          recorded: [processing]
          processing: [published, failed]
          published: [needs_review, archived]
          needs_review: [published]
          archived: []
          failed: [processing]
          cancelled: []

    BookingStatus:
      type: string
      description: |
        Status of a booking (`bookings.status`). A new booking is `held` for 10 minutes while the
        deposit is paid; if it is not paid in time it is `expired` and the slot is released.
      enum:
        - held
        - confirmed
        - completed
        - cancelled
        - no_show
        - expired
      x-state-machine:
        column: bookings.status
        initial: held
        transitions:
          held: [confirmed, expired]
          confirmed: [completed, cancelled, no_show]
          completed: []
          cancelled: []
          no_show: []
          expired: []

    ProcessingJobStatus:
      type: string
      description: |
        Status of an analysis job (`processing_jobs.status`). The job also stores its pipeline
        stage, so it resumes from there after a power cut.
      enum:
        - queued
        - running
        - succeeded
        - failed
      x-state-machine:
        column: processing_jobs.status
        initial: queued
        transitions:
          queued: [running]
          running: [succeeded, failed]
          succeeded: []
          failed: []

    PaymentStatus:
      type: string
      description: |
        Status of a payment (`payments.status`). Only the Mercado Pago webhook changes it, never
        the app.
      enum:
        - pending
        - approved
        - rejected
        - refunded
      x-state-machine:
        column: payments.status
        initial: pending
        transitions:
          pending: [approved, rejected]
          approved: [refunded]
          rejected: []
          refunded: []

    SettlementStatus:
      type: string
      description: |
        Status of a monthly settlement (`settlements.status`). It is drafted on the 1st of each
        month, approved by the team, invoiced and then paid.
      enum:
        - draft
        - approved
        - invoiced
        - paid
      x-state-machine:
        column: settlements.status
        initial: draft
        transitions:
          draft: [approved]
          approved: [invoiced]
          invoiced: [paid]
          paid: []

    # Club device API and pipeline results (sections 4, 5, 6 and 11). The results format is
    # shared by `ml` (produces it) and `services/edge-agent` (sends it). Coordinates are meters
    # with origin at the corner of side A: x across (0 to 10), y along (0 to 20, net at 10),
    # z height. Times are milliseconds from the start of the match video.
    ScoringRules:
      type: object
      description: How the match is scored (section 6), from the club settings at booking time.
      required: [golden_point, third_set]
      properties:
        golden_point:
          type: boolean
          description: True plays golden point at 40-40; false plays advantage.
        third_set:
          type: string
          description: A normal set with tie-break at 6-6, or a super tie-break to 10.
          enum: [set, super_tiebreak]

    DeviceScheduleItem:
      type: object
      required:
        - match_id
        - booking_id
        - court_id
        - match_type
        - starts_at
        - ends_at
        - record_from
        - record_until
        - no_record
        - scoring
        - updated_at
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        booking_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: '`null` for a recording started by hand from the panel.'
        court_id:
          $ref: '#/components/schemas/Uuid'
        match_type:
          type: string
          enum: [match, lesson]
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        record_from:
          $ref: '#/components/schemas/Timestamp'
        record_until:
          $ref: '#/components/schemas/Timestamp'
        no_record:
          type: boolean
        scoring:
          $ref: '#/components/schemas/ScoringRules'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    DeviceSchedule:
      type: object
      required: [club_id, generated_at, valid_until, items]
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        valid_until:
          $ref: '#/components/schemas/Timestamp'
          description: End of the 48-hour window.
        items:
          type: array
          description: Ordered by `record_from`. A cancelled turn disappears from the list.
          items:
            $ref: '#/components/schemas/DeviceScheduleItem'

    DeviceCameraHealth:
      type: object
      required: [camera_id, online, fps, recording]
      properties:
        camera_id:
          $ref: '#/components/schemas/Uuid'
        online:
          type: boolean
        fps:
          type:
            - number
            - 'null'
          minimum: 0
        recording:
          type: boolean

    DeviceHeartbeat:
      type: object
      required:
        - sent_at
        - software_version
        - uptime_seconds
        - disk_free_bytes
        - disk_total_bytes
        - gpu_temp_c
        - cameras
        - upload_queue
        - processing_backlog_minutes
      properties:
        sent_at:
          $ref: '#/components/schemas/Timestamp'
        software_version:
          type: string
        uptime_seconds:
          type: integer
          minimum: 0
        disk_free_bytes:
          type: integer
          minimum: 0
        disk_total_bytes:
          type: integer
          minimum: 1
        gpu_temp_c:
          type:
            - number
            - 'null'
        cpu_temp_c:
          type:
            - number
            - 'null'
        cameras:
          type: array
          items:
            $ref: '#/components/schemas/DeviceCameraHealth'
        upload_queue:
          type: object
          required: [items, bytes, eta_minutes]
          properties:
            items:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
            eta_minutes:
              type: integer
              minimum: 0
        processing_backlog_minutes:
          type: integer
          minimum: 0
          description: Local analysis backlog. Over 6 hours the oldest matches go to the cloud GPU.

    DeviceHeartbeatAck:
      type: object
      required: [server_time, desired_software_version]
      properties:
        server_time:
          $ref: '#/components/schemas/Timestamp'
        desired_software_version:
          type: string
          description: Version the `updater` installs between 4 and 6 a.m.

    CourtEnd:
      type: string
      description: End of the court (camera end, or the side a team starts on).
      enum: [A, B]

    CourtPosition:
      type: object
      description: |
        Position in meters (see the format note above). `z` is `null` without 3D (the ball is
        triangulated only when both cameras see it). Values outside the court (lobs, exits,
        players behind the glass) are allowed within the 1.5 m mask and beyond for the ball.
      required: [x, y]
      properties:
        x:
          type: number
          minimum: -5
          maximum: 15
        y:
          type: number
          minimum: -5
          maximum: 25
        z:
          type:
            - number
            - 'null'
          minimum: 0

    PipelinePosition:
      type: integer
      enum: [1, 2, 3, 4]
      description: One of the 4 tracks (section 5, step 3).

    PipelineTeam:
      type: integer
      enum: [1, 2]

    PipelineShotType:
      type: string
      description: Section 5, step 9. `unknown` under 0.6 confidence.
      enum:
        - serve
        - forehand
        - backhand
        - forehand_volley
        - backhand_volley
        - bandeja
        - vibora
        - smash
        - lob
        - wall_exit
        - unknown

    BounceSurface:
      type: string
      description: Section 5, step 8.
      enum: [floor, back_glass, side_glass, fence, net]

    PipelinePointEndReason:
      type: string
      description: Rule of section 6 that closed the point, in evaluation order.
      enum:
        - double_fault
        - own_floor_before_net
        - net
        - rival_wall_before_floor
        - double_bounce
        - out_after_bounce
        - ball_lost

    ResultPlayer:
      type: object
      required: [position, team, initial_side, thumbnail_media_id, track_coverage_pct]
      properties:
        position:
          $ref: '#/components/schemas/PipelinePosition'
        team:
          $ref: '#/components/schemas/PipelineTeam'
        initial_side:
          $ref: '#/components/schemas/CourtEnd'
        thumbnail_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Thumbnail for "este soy yo", from `POST /device/uploads`.
        track_coverage_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Share of rally frames where this track was seen.

    ResultEventRef:
      type: object
      required: [kind, index]
      properties:
        kind:
          type: string
          enum: [shot, bounce]
        index:
          type: integer
          minimum: 0
          description: Index in `shots` or `bounces`.

    ResultPoint:
      type: object
      required:
        - number
        - set
        - game
        - server_position
        - serve_faults
        - winner_team
        - end_reason
        - deciding_event
        - confidence
        - needs_review
        - start_ms
        - end_ms
      properties:
        number:
          type: integer
          minimum: 1
          description: 1-based, consecutive over the match.
        set:
          type: integer
          minimum: 1
          maximum: 3
        game:
          type: integer
          minimum: 1
          description: 1-based within the set; the tie-break is game 13.
        server_position:
          $ref: '#/components/schemas/PipelinePosition'
        serve_faults:
          type: integer
          minimum: 0
          maximum: 2
        winner_team:
          $ref: '#/components/schemas/PipelineTeam'
        end_reason:
          $ref: '#/components/schemas/PipelinePointEndReason'
        deciding_event:
          oneOf:
            - $ref: '#/components/schemas/ResultEventRef'
            - type: 'null'
          description: The event that closed the point; `null` for `ball_lost`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Product of the confidence of the deciding events (section 6, layer 2).
        needs_review:
          type: boolean
          description: Confidence under the review threshold of `ml/config/thresholds.yaml` (0.7).
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0

    ResultShot:
      type: object
      required:
        - point_number
        - t_ms
        - player_position
        - shot_type
        - shot_type_confidence
        - player_at
        - ball_at
        - speed_kmh
        - after_bounce
        - off_wall
        - camera
      properties:
        point_number:
          type: integer
          minimum: 1
        t_ms:
          type: integer
          minimum: 0
        player_position:
          $ref: '#/components/schemas/PipelinePosition'
        shot_type:
          $ref: '#/components/schemas/PipelineShotType'
        shot_type_confidence:
          type: number
          minimum: 0
          maximum: 1
        player_at:
          $ref: '#/components/schemas/CourtPosition'
          description: Player's foot point at contact.
        ball_at:
          $ref: '#/components/schemas/CourtPosition'
          description: Ball at contact.
        speed_kmh:
          type:
            - number
            - 'null'
          minimum: 0
          description: Estimated, only with 3D positions.
        after_bounce:
          type: boolean
        off_wall:
          type: boolean
          description: The ball came off a wall before the shot (salida de pared).
        camera:
          $ref: '#/components/schemas/CourtEnd'

    ResultBounce:
      type: object
      required: [point_number, t_ms, surface, ball_at, confidence]
      properties:
        point_number:
          type: integer
          minimum: 1
        t_ms:
          type: integer
          minimum: 0
        surface:
          $ref: '#/components/schemas/BounceSurface'
        ball_at:
          $ref: '#/components/schemas/CourtPosition'
        confidence:
          type: number
          minimum: 0
          maximum: 1

    ResultCorrection:
      type: object
      description: A point changed by serve coherence (section 6, layer 1).
      required: [layer, point_number, from_winner_team, to_winner_team]
      properties:
        layer:
          type: string
          enum: [serve_coherence]
        point_number:
          type: integer
          minimum: 1
        from_winner_team:
          $ref: '#/components/schemas/PipelineTeam'
        to_winner_team:
          $ref: '#/components/schemas/PipelineTeam'

    ResultStats:
      type: object
      description: |
        Stats of one position computed on the device with the versioned formulas of section 7.
        `values` keys are the metric names of `ml` (for example `points_won`, `winners`,
        `net_time_pct`, `distance_m`); the cloud recomputes them after a score correction.
      required: [position, formula_version, values]
      properties:
        position:
          $ref: '#/components/schemas/PipelinePosition'
        formula_version:
          type: string
        values:
          type: object
          additionalProperties:
            type: number

    ResultHighlight:
      type: object
      required: [point_number, score, start_ms, end_ms, clip_media_id]
      properties:
        point_number:
          type: integer
          minimum: 1
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Highlight score of section 7.
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0
        clip_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    ResultCalibration:
      type: object
      required: [camera, calibration_id, reprojection_error_cm]
      properties:
        camera:
          $ref: '#/components/schemas/CourtEnd'
        calibration_id:
          $ref: '#/components/schemas/Uuid'
        reprojection_error_cm:
          type: number
          minimum: 0

    ResultModelVersions:
      type: object
      required: [player_detector, ball_tracker, pose, shot_classifier, reid]
      properties:
        player_detector:
          type: string
        ball_tracker:
          type: string
        pose:
          type: string
        shot_classifier:
          type: string
        reid:
          type: string

    MatchResults:
      type: object
      description: |
        Output of the club pipeline for one match (schema version 1). `points`, `shots` and
        `bounces` are each ordered by time; shots and bounces link to their point by
        `point_number`. On `status: failed` only the run metadata and `failure` are sent.
      required:
        - schema_version
        - run_id
        - match_id
        - status
        - processed_on
        - pipeline_version
        - model_versions
        - thresholds_sha256
        - started_at
        - finished_at
        - video
        - calibrations
        - scoring
        - players
        - points
        - shots
        - bounces
        - score
        - corrections
        - stats
        - highlights
      properties:
        schema_version:
          type: integer
          const: 1
        run_id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [succeeded, failed]
        failure:
          type:
            - object
            - 'null'
          required: [stage, code]
          properties:
            stage:
              type: string
              examples: [ball_tracking]
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]*$'
        processed_on:
          type: string
          enum: [club, cloud]
        pipeline_version:
          type: string
        model_versions:
          $ref: '#/components/schemas/ResultModelVersions'
        thresholds_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of `ml/config/thresholds.yaml` used in the run.
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          $ref: '#/components/schemas/Timestamp'
        video:
          type: object
          required: [duration_ms, fps, camera_offset_ms]
          properties:
            duration_ms:
              type: integer
              minimum: 0
            fps:
              type: number
              exclusiveMinimum: 0
            camera_offset_ms:
              type: integer
              description: Fine offset of camera B relative to A, from ball trajectory alignment.
        calibrations:
          type: array
          items:
            $ref: '#/components/schemas/ResultCalibration'
        scoring:
          $ref: '#/components/schemas/ScoringRules'
        players:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ResultPlayer'
        points:
          type: array
          items:
            $ref: '#/components/schemas/ResultPoint'
        shots:
          type: array
          items:
            $ref: '#/components/schemas/ResultShot'
        bounces:
          type: array
          items:
            $ref: '#/components/schemas/ResultBounce'
        score:
          type: object
          required: [sets, winner_team, completed]
          properties:
            sets:
              type: array
              items:
                $ref: '#/components/schemas/SetScore'
            winner_team:
              oneOf:
                - $ref: '#/components/schemas/PipelineTeam'
                - type: 'null'
            completed:
              type: boolean
              description: False when the turn ended before the match did.
        corrections:
          type: array
          items:
            $ref: '#/components/schemas/ResultCorrection'
        stats:
          type: array
          items:
            $ref: '#/components/schemas/ResultStats'
        highlights:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ResultHighlight'

    MatchResultsAck:
      type: object
      required: [match_id, run_id, match_status]
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        run_id:
          $ref: '#/components/schemas/Uuid'
        match_status:
          $ref: '#/components/schemas/MatchStatus'

    DeviceUploadKind:
      type: string
      enum: [full, clip, reel, thumbnail]

    DeviceUploadRequest:
      type: object
      required: [match_id, kind, content_type, size_bytes, sha256]
      additionalProperties: false
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/DeviceUploadKind'
        content_type:
          type: string
          enum: [video/mp4, image/jpeg]
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
        clip:
          type:
            - object
            - 'null'
          description: 'Required for `kind: clip`.'
          required: [start_ms, end_ms, source]
          properties:
            start_ms:
              type: integer
              minimum: 0
            end_ms:
              type: integer
              minimum: 0
            source:
              type: string
              enum: [app, button, auto]
            requested_by_user_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
              description: The player who tapped in the app, from the court channel.
        upload_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Resume an existing upload and get fresh part links.

    DeviceUploadPart:
      type: object
      required: [number, url]
      properties:
        number:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
          description: Signed `PUT` link for this part, valid 1 hour.

    DeviceUpload:
      type: object
      required: [upload_id, media_id, part_size_bytes, parts, expires_at]
      properties:
        upload_id:
          $ref: '#/components/schemas/Uuid'
        media_id:
          $ref: '#/components/schemas/Uuid'
        part_size_bytes:
          type: integer
          minimum: 5242880
        parts:
          type: array
          description: Links for the parts not uploaded yet.
          items:
            $ref: '#/components/schemas/DeviceUploadPart'
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    DeviceUploadComplete:
      type: object
      required: [parts]
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [number, etag]
            properties:
              number:
                type: integer
                minimum: 1
              etag:
                type: string

    DeviceUploadDone:
      type: object
      required: [upload_id, media_id, status]
      properties:
        upload_id:
          $ref: '#/components/schemas/Uuid'
        media_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [ready]
    HealthStatus:
      type: object
      description: Liveness result.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    PhoneNumber:
      type: string
      description: Phone in E.164 format, with country code (WhatsApp number).
      pattern: '^\+[1-9][0-9]{7,14}$'
      examples:
        - '+5491155550123'

    SignUpConsent:
      type: object
      description: |
        Acceptance of the terms and the privacy policy (Ley 25.326), required to create an
        account. Sending it means the user accepted the given versions; the server stores the
        versions and the time.
      required: [terms_version, privacy_version]
      properties:
        terms_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the terms the user saw, e.g. `2026-10-01`.
        privacy_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the privacy policy the user saw.

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'

    OtpChallenge:
      type: object
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds:
          type: integer
          minimum: 0
          description: Seconds until the code expires (300).
        resend_after_seconds:
          type: integer
          minimum: 0
          description: Seconds before the app may ask for a new code.

    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The 6-digit code received by WhatsApp.
        consent:
          $ref: '#/components/schemas/SignUpConsent'

    OAuthSignInRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: ID token issued by the provider to this app.
        nonce:
          type: string
          minLength: 1
          maxLength: 256
          description: Raw nonce used when asking for the token, checked against its `nonce` claim.
        consent:
          $ref: '#/components/schemas/SignUpConsent'

    AppleSignInRequest:
      allOf:
        - $ref: '#/components/schemas/OAuthSignInRequest'
        - type: object
          properties:
            full_name:
              type: string
              minLength: 1
              maxLength: 120
              description: Name Apple sent on the first authorization only.

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 512

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT for the `Authorization` header. Valid for 15 minutes.
        refresh_token:
          type: string
          description: Opaque, single-use token valid for 30 days. Store it securely.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the access token expires (900).

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, is_new_user]
          properties:
            user:
              $ref: '#/components/schemas/User'
            is_new_user:
              type: boolean
              description: True when this request created the account.

    DeclaredCategory:
      type: string
      description: Self-declared Argentine padel category, from 8va (`8`) to 1ra (`1`).
      enum: ['1', '2', '3', '4', '5', '6', '7', '8']

    ClubRanking:
      type: object
      required: [club_id, category, window_months, entries]
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/DeclaredCategory'
        window_months:
          type: integer
          description: Months of play the ranking looks at (12).
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ClubRankingEntry'

    ClubRankingEntry:
      type: object
      required: [position, user_id, name, photo_url, matches, wins, is_me]
      properties:
        position:
          type: integer
          minimum: 1
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        photo_url:
          type: [string, 'null']
        matches:
          type: integer
          description: Finished matches played in this club in the window.
        wins:
          type: integer
        is_me:
          type: boolean
          description: True for the caller's own row.

    # Tournaments (CL-08, 21/10/2026 specification).
    TournamentCategory:
      type: integer
      minimum: 1
      maximum: 6
      description: 1st (top) to 6th.

    TournamentStatus:
      type: string
      enum: [registration, in_progress, finished, cancelled]

    TournamentStage:
      type: string
      enum: [group, round_of_16, quarter, semi, final]

    TournamentMatchStatus:
      type: string
      enum: [scheduled, awaiting_confirmation, confirmed]

    TournamentPoints:
      type: object
      description: Ranking points by result. Defaults 100, 60, 36, 18 and 5.
      required: [champion, finalist, semifinal, quarterfinal, group_win]
      properties:
        champion:
          type: integer
          minimum: 0
        finalist:
          type: integer
          minimum: 0
        semifinal:
          type: integer
          minimum: 0
        quarterfinal:
          type: integer
          minimum: 0
        group_win:
          type: integer
          minimum: 0

    Tournament:
      type: object
      required:
        [id, club_id, name, category, status, entry_fee_cents, match_minutes, points, pair_count]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        category:
          $ref: '#/components/schemas/TournamentCategory'
        status:
          $ref: '#/components/schemas/TournamentStatus'
        entry_fee_cents:
          type: integer
          minimum: 0
        match_minutes:
          type: integer
          minimum: 30
          maximum: 180
        points:
          $ref: '#/components/schemas/TournamentPoints'
        pair_count:
          type: integer
          description: Active pairs.

    TournamentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'

    TournamentCreate:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/TournamentCategory'
        entry_fee_cents:
          type: integer
          minimum: 0
          default: 0
        match_minutes:
          type: integer
          minimum: 30
          maximum: 180
          default: 90
        points:
          $ref: '#/components/schemas/TournamentPoints'

    TournamentRegister:
      type: object
      required: [partner_user_id]
      properties:
        partner_user_id:
          $ref: '#/components/schemas/Uuid'

    TournamentDraw:
      type: object
      required: [court_ids, window_starts_at, window_ends_at]
      properties:
        court_ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Uuid'
        window_starts_at:
          $ref: '#/components/schemas/Timestamp'
        window_ends_at:
          $ref: '#/components/schemas/Timestamp'

    TournamentPlayer:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    TournamentPair:
      type: object
      required: [id, players, seed, group_id, paid]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        players:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/TournamentPlayer'
        seed:
          type:
            - integer
            - 'null'
          description: Position by strength at the draw, 1 the strongest; null before it.
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        paid:
          type: boolean

    TournamentSetScore:
      type: object
      required: [team_1, team_2]
      properties:
        team_1:
          type: integer
          minimum: 0
          maximum: 7
        team_2:
          type: integer
          minimum: 0
          maximum: 7

    TournamentResult:
      type: object
      required: [sets]
      properties:
        sets:
          type: array
          minItems: 2
          maxItems: 3
          items:
            $ref: '#/components/schemas/TournamentSetScore'

    TournamentStanding:
      type: object
      required: [pair_id, played, wins, sets_for, sets_against, games_for, games_against]
      properties:
        pair_id:
          $ref: '#/components/schemas/Uuid'
        played:
          type: integer
        wins:
          type: integer
        sets_for:
          type: integer
        sets_against:
          type: integer
        games_for:
          type: integer
        games_against:
          type: integer

    TournamentGroup:
      type: object
      required: [id, position, pair_ids, standings]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          description: 0-based; shown as Group A, B, C.
        pair_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        standings:
          type: array
          description: Table ordered best first.
          items:
            $ref: '#/components/schemas/TournamentStanding'

    TournamentMatch:
      type: object
      required:
        [
          id,
          stage,
          group_id,
          round,
          pair_a_id,
          pair_b_id,
          court_id,
          starts_at,
          ends_at,
          status,
          sets,
          winner_pair_id,
          reported_by_user_id,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        stage:
          $ref: '#/components/schemas/TournamentStage'
        group_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        round:
          type: integer
        pair_a_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        pair_b_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/TournamentMatchStatus'
        sets:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/TournamentSetScore'
        winner_pair_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        reported_by_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    TournamentDetail:
      allOf:
        - $ref: '#/components/schemas/Tournament'
        - type: object
          required: [pairs, groups, matches]
          properties:
            pairs:
              type: array
              items:
                $ref: '#/components/schemas/TournamentPair'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/TournamentGroup'
            matches:
              type: array
              description: Group matches by round, then the knockout from the first round to the final.
              items:
                $ref: '#/components/schemas/TournamentMatch'

    TournamentRankingEntry:
      type: object
      required: [position, user_id, name, points, tournaments, is_me]
      properties:
        position:
          type: integer
          minimum: 1
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        points:
          type: integer
        tournaments:
          type: integer
          description: Tournaments that gave points inside the window.
        is_me:
          type: boolean

    TournamentRanking:
      type: object
      required: [club_id, category, window_months, entries]
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        category:
          $ref: '#/components/schemas/TournamentCategory'
        window_months:
          type: integer
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TournamentRankingEntry'

    DominantHand:
      type: string
      enum: [right, left]

    PlayingSide:
      type: string
      description: Preferred side of the court. `drive` is the right side, `reves` the left.
      enum: [drive, reves, both]

    User:
      type: object
      description: The signed-in user's own profile. Only the owner sees phone, email and birth date.
      required:
        - id
        - display_name
        - phone
        - email
        - photo_url
        - declared_category
        - dominant_hand
        - playing_side
        - birth_date
        - training_opt_out
        - terms_version
        - terms_accepted_at
        - privacy_version
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type:
            - string
            - 'null'
          description: Verified WhatsApp phone in E.164, or `null` if the user signed in only with Google or Apple.
        email:
          type:
            - string
            - 'null'
          maxLength: 254
          description: |
            Email from Google or Apple, or `null`. Plain string on purpose (no `format: email`), so
            the Python models do not need `email-validator`.
        photo_url:
          type:
            - string
            - 'null'
          format: uri
        declared_category:
          oneOf:
            - $ref: '#/components/schemas/DeclaredCategory'
            - type: 'null'
        dominant_hand:
          oneOf:
            - $ref: '#/components/schemas/DominantHand'
            - type: 'null'
        playing_side:
          oneOf:
            - $ref: '#/components/schemas/PlayingSide'
            - type: 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
          description: Used to apply the minors rule (no recording without a guardian's permission).
        training_opt_out:
          type: boolean
          description: True when the user asked that their videos not be used to train the AI.
        terms_version:
          type: string
          description: Version of the terms the user accepted.
        terms_accepted_at:
          $ref: '#/components/schemas/Timestamp'
        privacy_version:
          type: string
          description: Version of the privacy policy the user accepted.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    UserUpdate:
      type: object
      description: Fields of `User` the owner may change. At least one is required.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        photo_url:
          type:
            - string
            - 'null'
          format: uri
        declared_category:
          oneOf:
            - $ref: '#/components/schemas/DeclaredCategory'
            - type: 'null'
        dominant_hand:
          oneOf:
            - $ref: '#/components/schemas/DominantHand'
            - type: 'null'
        playing_side:
          oneOf:
            - $ref: '#/components/schemas/PlayingSide'
            - type: 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
        training_opt_out:
          type: boolean

    AccountDeletion:
      type: object
      required: [deletion_scheduled_for]
      properties:
        deletion_scheduled_for:
          $ref: '#/components/schemas/Timestamp'

    EntityRef:
      type: object
      description: Id and display name of a related entity.
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    SetScore:
      type: object
      description: Games won by each team in one set.
      required: [team_1, team_2]
      properties:
        team_1:
          type: integer
          minimum: 0
        team_2:
          type: integer
          minimum: 0

    MatchSummary:
      type: object
      description: A match in the user's list, seen from that user's side.
      required: [id, type, status, starts_at, ends_at, club, court, team, won, sets]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [match, lesson]
        status:
          $ref: '#/components/schemas/MatchStatus'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        club:
          $ref: '#/components/schemas/EntityRef'
        court:
          $ref: '#/components/schemas/EntityRef'
        team:
          type:
            - integer
            - 'null'
          enum: [1, 2, null]
          description: The user's team, or `null` while not assigned.
        won:
          type:
            - boolean
            - 'null'
          description: Whether the user's team won, or `null` until the match is published.
        sets:
          type: array
          description: Final score per set; empty until the match is published.
          items:
            $ref: '#/components/schemas/SetScore'

    MatchSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MatchSummary'

    # Matches and media (section 11). Media is always referenced by id; the only URL to a video,
    # clip, reel or thumbnail is the signed one of `GET /media/{id}/url`, valid 1 hour.
    MatchPosition:
      type: integer
      enum: [1, 2, 3, 4]
      description: One of the four tracked players of a match (the 4 tracks of section 5).

    Team:
      type: integer
      enum: [1, 2]
      description: Team 1 or 2, fixed by the side of the net at the first serve.

    CourtZone:
      type: string
      description: |
        One of the 9 zones of each half (section 7): width `left`, `center`, `right` by depth
        `net` (0 to 3 m from the net), `mid` (3 to 6.95 m) and `back` (6.95 to 10 m).
      enum:
        - net_left
        - net_center
        - net_right
        - mid_left
        - mid_center
        - mid_right
        - back_left
        - back_center
        - back_right

    ShotType:
      type: string
      description: |
        Shot type from the classifier (section 5, step 9). `unknown` when confidence is under
        0.6; it does not count in per-type stats.
      enum:
        - serve
        - forehand
        - backhand
        - forehand_volley
        - backhand_volley
        - bandeja
        - vibora
        - smash
        - lob
        - wall_exit
        - unknown

    ShotTypeStats:
      type: object
      description: Count and outcome of one shot type for a player.
      required: [shot_type, count, winners, errors]
      properties:
        shot_type:
          $ref: '#/components/schemas/ShotType'
        count:
          type: integer
          minimum: 0
        winners:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0

    ZoneCount:
      type: object
      description: Points lost whose decisive event was in a zone (section 7, "dónde se fue el partido").
      required: [zone, points]
      properties:
        zone:
          $ref: '#/components/schemas/CourtZone'
        points:
          type: integer
          minimum: 0

    PlayerMatchStats:
      type: object
      description: |
        One player's stats for one match (`match_stats`), computed with fixed, versioned formulas
        (section 7). Percentages are 0 to 100. `max_ball_speed_kmh` is an estimate and is `null`
        without 3D ball positions.
      required:
        - formula_version
        - points_won
        - winners
        - forced_errors
        - unforced_errors
        - net_time_pct
        - net_approaches
        - distance_m
        - serve_points_won_pct
        - first_serve_in_pct
        - max_ball_speed_kmh
        - shots_by_type
        - lost_points_by_zone
      properties:
        formula_version:
          type: string
          examples: ['1.0.0']
        points_won:
          type: integer
          minimum: 0
        winners:
          type: integer
          minimum: 0
        forced_errors:
          type: integer
          minimum: 0
        unforced_errors:
          type: integer
          minimum: 0
        net_time_pct:
          type: number
          minimum: 0
          maximum: 100
        net_approaches:
          type: integer
          minimum: 0
        distance_m:
          type: number
          minimum: 0
        serve_points_won_pct:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        first_serve_in_pct:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 100
        max_ball_speed_kmh:
          type:
            - number
            - 'null'
          minimum: 0
        shots_by_type:
          type: array
          items:
            $ref: '#/components/schemas/ShotTypeStats'
        lost_points_by_zone:
          type: array
          items:
            $ref: '#/components/schemas/ZoneCount'

    MatchPlayer:
      type: object
      description: |
        One of the four tracked players. `user` is `null` until someone claims the position.
        `stats` is `null` for club staff and owner, and before the match is published.
      required: [position, team, user, confirmed, thumbnail_media_id, stats]
      properties:
        position:
          $ref: '#/components/schemas/MatchPosition'
        team:
          $ref: '#/components/schemas/Team'
        user:
          oneOf:
            - $ref: '#/components/schemas/MatchPlayerUser'
            - type: 'null'
        confirmed:
          type: boolean
          description: True when the user confirmed the position ("este soy yo").
        suggested:
          type: boolean
          description: |
            True when this position is suggested to the caller because they scanned the court QR
            and were the closest player to the camera at that moment.
        thumbnail_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Thumbnail used to pick "este soy yo". Fetch it with `GET /media/{id}/url`.
        stats:
          oneOf:
            - $ref: '#/components/schemas/PlayerMatchStats'
            - type: 'null'

    MatchPlayerUser:
      type: object
      description: Public view of a player inside a match they share with the caller.
      required: [id, display_name, photo_url]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_name:
          type: string
        photo_url:
          type:
            - string
            - 'null'
          format: uri
          description: Profile photo (not a video).

    PointEndReason:
      type: string
      description: Rule of section 6 that closed the point.
      enum:
        - double_fault
        - own_floor_before_net
        - net
        - rival_wall_before_floor
        - double_bounce
        - out_after_bounce
        - ball_lost

    PointToReview:
      type: object
      description: |
        A point with confidence under 0.7 (section 6, layer 2). The app shows its clip so the
        players confirm who won it.
      required: [id, number, set, game, winner_team, end_reason, confidence, clip_media_id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        number:
          type: integer
          minimum: 1
        set:
          type: integer
          minimum: 1
        game:
          type: integer
          minimum: 1
        winner_team:
          $ref: '#/components/schemas/Team'
        end_reason:
          $ref: '#/components/schemas/PointEndReason'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        clip_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    Insight:
      type: object
      description: |
        One sentence about the caller's match (section 7), written from a computed fact, with a
        tip for the next match. Text is `es-AR`, produced by the insights pipeline.
      required: [id, kind, text, tip, order]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          examples: [net_uncovered]
        text:
          type: string
          maxLength: 200
        tip:
          type:
            - string
            - 'null'
        order:
          type: integer
          minimum: 1

    MediaKind:
      type: string
      enum: [full, clip, reel, thumbnail]

    MediaStatus:
      type: string
      description: |
        `processing` while it is cut, encoded or uploaded; `ready` when a signed link can be
        issued; `in_club` when the full video stayed in the club (ask with
        `POST /media/{id}/download`); `expired` after it was deleted (full videos after 30 days).
      enum: [processing, in_club, ready, expired]

    MediaAsset:
      type: object
      description: A video, clip, reel or thumbnail, by id. Never carries its storage path or URL.
      required: [id, kind, status, duration_ms, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/MediaKind'
        status:
          $ref: '#/components/schemas/MediaStatus'
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: '`null` for thumbnails.'
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: When the media is deleted (full video 30 days after the match), or `null`.

    ClipSource:
      type: string
      description: '`app` (tap or cut in the app), `button` (court button) or `auto` (highlight).'
      enum: [app, button, auto]

    Clip:
      type: object
      required:
        - id
        - match_id
        - source
        - start_ms
        - end_ms
        - highlight_score
        - created_by_user_id
        - media
        - thumbnail_media_id
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
        source:
          $ref: '#/components/schemas/ClipSource'
        start_ms:
          type: integer
          minimum: 0
          description: Offset from the start of the match video.
        end_ms:
          type: integer
          minimum: 0
        highlight_score:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: Automatic highlight score (section 7); `null` for app and button clips.
        created_by_user_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: '`null` for button clips and automatic highlights.'
        media:
          $ref: '#/components/schemas/MediaAsset'
        thumbnail_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    ClipPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Clip'

    ClipCreate:
      type: object
      required: [start_ms, end_ms]
      additionalProperties: false
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
          description: After `start_ms`, at most 60 000 ms later.

    MatchDetail:
      type: object
      description: A match seen by the caller. See `GET /matches/{id}` for what each role gets.
      required:
        - id
        - type
        - status
        - starts_at
        - ends_at
        - club
        - court
        - booking_id
        - golden_point
        - sets
        - winner_team
        - players
        - points_to_review
        - insights
        - full_video
        - reel
        - published_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [match, lesson]
        status:
          $ref: '#/components/schemas/MatchStatus'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        club:
          $ref: '#/components/schemas/EntityRef'
        court:
          $ref: '#/components/schemas/EntityRef'
        booking_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: '`null` for a recording started by hand from the club panel.'
        golden_point:
          type: boolean
          description: True plays golden point at deuce; false plays advantage.
        sets:
          type: array
          description: Score per set; empty until published.
          items:
            $ref: '#/components/schemas/SetScore'
        winner_team:
          oneOf:
            - $ref: '#/components/schemas/Team'
            - type: 'null'
        players:
          type: array
          description: The four positions; empty until published.
          maxItems: 4
          items:
            $ref: '#/components/schemas/MatchPlayer'
        points_to_review:
          type: array
          description: Points under 0.7 confidence, for the players to confirm. Empty for staff.
          items:
            $ref: '#/components/schemas/PointToReview'
        insights:
          type:
            - array
            - 'null'
          description: The caller's 3 insights; `null` for staff and owner or when not a player.
          items:
            $ref: '#/components/schemas/Insight'
        full_video:
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'
        reel:
          oneOf:
            - $ref: '#/components/schemas/MediaAsset'
            - type: 'null'
          description: The caller's vertical reel, or `null` until generated.
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    ClaimPlayerRequest:
      type: object
      required: [position]
      additionalProperties: false
      properties:
        position:
          $ref: '#/components/schemas/MatchPosition'

    ScoreCorrectionFinalScore:
      type: object
      required: [type, sets]
      additionalProperties: false
      properties:
        type:
          type: string
          const: final_score
        sets:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/SetScore'

    ScoreCorrectionPointWinner:
      type: object
      required: [type, point_id, winner_team]
      additionalProperties: false
      properties:
        type:
          type: string
          const: point_winner
        point_id:
          $ref: '#/components/schemas/Uuid'
        winner_team:
          $ref: '#/components/schemas/Team'

    ScoreCorrectionRequest:
      oneOf:
        - $ref: '#/components/schemas/ScoreCorrectionFinalScore'
        - $ref: '#/components/schemas/ScoreCorrectionPointWinner'
      discriminator:
        propertyName: type
        mapping:
          final_score: '#/components/schemas/ScoreCorrectionFinalScore'
          point_winner: '#/components/schemas/ScoreCorrectionPointWinner'

    ScoreCorrection:
      type: object
      required: [id, match_id, type, match_status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          enum: [final_score, point_winner]
        match_status:
          $ref: '#/components/schemas/MatchStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    SignedMediaUrl:
      type: object
      description: A signed, temporary link. Never store it; ask again when it expires.
      required: [media_id, url, expires_at, content_type]
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
        url:
          type: string
          format: uri
          description: Signed storage URL, valid until `expires_at` (at most 1 hour).
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        content_type:
          type: string
          examples: [video/mp4, image/jpeg]

    MediaDownload:
      type: object
      required: [media_id, status, url, expires_at]
      properties:
        media_id:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum: [ready, preparing]
        url:
          type:
            - string
            - 'null'
          format: uri
          description: Signed download link valid at most 1 hour; `null` while `preparing`.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    UserStats:
      type: object
      description: Aggregate stats over the user's published matches.
      required:
        - matches_played
        - matches_won
        - sets_won
        - sets_lost
        - points_won
        - points_played
        - rating
        - last_match_at
      properties:
        matches_played:
          type: integer
          minimum: 0
        matches_won:
          type: integer
          minimum: 0
        sets_won:
          type: integer
          minimum: 0
        sets_lost:
          type: integer
          minimum: 0
        points_won:
          type: integer
          minimum: 0
        points_played:
          type: integer
          minimum: 0
        rating:
          type:
            - number
            - 'null'
          description: Current level estimate, or `null` until enough matches are published.
        last_match_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # Lessons, coach and payments (sections 10 and 11).
    LessonKind:
      type: string
      description: |
        `private` or `group` lesson, or a `school` (escuelita), which is "do not record" by
        default (section 12).
      enum: [private, group, school]

    LessonRequestStatus:
      type: string
      enum: [pending, accepted, rejected, cancelled]

    LessonRequestCreate:
      type: object
      required: [club_id, coach_id]
      additionalProperties: false
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        coach_id:
          $ref: '#/components/schemas/Uuid'
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        message:
          type: string
          maxLength: 500
          description: What the student wants to work on.

    LessonRequestDecision:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500

    LessonRequest:
      type: object
      required:
        - id
        - club
        - coach
        - student
        - court
        - starts_at
        - ends_at
        - duration_minutes
        - message
        - status
        - reason
        - lesson_id
        - created_at
        - decided_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club:
          $ref: '#/components/schemas/EntityRef'
        coach:
          $ref: '#/components/schemas/EntityRef'
        student:
          $ref: '#/components/schemas/EntityRef'
        court:
          $ref: '#/components/schemas/EntityRef'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        message:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/LessonRequestStatus'
        reason:
          type:
            - string
            - 'null'
          description: The coach's reason when rejecting.
        lesson_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The lesson created when the request was accepted.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        decided_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    LessonRequestResult:
      type: object
      required: [mode, request, whatsapp_url]
      properties:
        mode:
          type: string
          enum: [app, whatsapp]
        request:
          oneOf:
            - $ref: '#/components/schemas/LessonRequest'
            - type: 'null'
          description: 'The pending request (`mode: app`).'
        whatsapp_url:
          type:
            - string
            - 'null'
          description: '`wa.me` link to the coach (`mode: whatsapp`).'

    LessonRequestPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LessonRequest'

    LessonCreate:
      type: object
      required: [court_id, starts_at, duration_minutes, kind]
      additionalProperties: false
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        kind:
          $ref: '#/components/schemas/LessonKind'
        student_ids:
          type: array
          maxItems: 12
          uniqueItems: true
          description: Students with an account. Others join with the invite link.
          items:
            $ref: '#/components/schemas/Uuid'
        price_cents:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Price per student in ARS cents, or `null` if the lesson is not charged in the app.
        record:
          type: boolean
          description: |
            Record the lesson. Defaults to true, and to false for `school`. A minor without a
            guardian permission is never recorded.
        focus:
          type:
            - string
            - 'null'
          maxLength: 200
          description: What the lesson works on, shown to the students.

    LessonStudent:
      type: object
      required: [user, accepted, payment_status]
      properties:
        user:
          $ref: '#/components/schemas/EntityRef'
        accepted:
          type: boolean
        payment_status:
          oneOf:
            - $ref: '#/components/schemas/PaymentStatus'
            - type: 'null'
          description: Status of this student's lesson payment, or `null` if not charged or not started.

    Lesson:
      type: object
      required:
        - id
        - club
        - court
        - coach
        - kind
        - starts_at
        - ends_at
        - booking_id
        - booking_status
        - match_id
        - students
        - price_cents
        - no_record
        - no_record_reason
        - focus
        - notes_count
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club:
          $ref: '#/components/schemas/EntityRef'
        court:
          $ref: '#/components/schemas/EntityRef'
        coach:
          $ref: '#/components/schemas/EntityRef'
        kind:
          $ref: '#/components/schemas/LessonKind'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        booking_id:
          $ref: '#/components/schemas/Uuid'
        booking_status:
          $ref: '#/components/schemas/BookingStatus'
        match_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: 'The recorded lesson (`type: lesson`), once recording started.'
        students:
          type: array
          items:
            $ref: '#/components/schemas/LessonStudent'
        price_cents:
          type:
            - integer
            - 'null'
          minimum: 1
        no_record:
          type: boolean
        no_record_reason:
          oneOf:
            - $ref: '#/components/schemas/NoRecordReason'
            - type: 'null'
        focus:
          type:
            - string
            - 'null'
        notes_count:
          type: integer
          minimum: 0

    LessonPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Lesson'

    DrawingStroke:
      type: object
      required: [color, width, points]
      additionalProperties: false
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        width:
          type: number
          exclusiveMinimum: 0
          maximum: 0.1
          description: Stroke width as a fraction of the frame width.
        points:
          type: array
          minItems: 2
          maxItems: 500
          description: '`[x, y]` pairs, each 0..1 relative to the video frame.'
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
              minimum: 0
              maximum: 1

    Drawing:
      type: object
      required: [strokes]
      additionalProperties: false
      description: A drawing over one video frame.
      properties:
        strokes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DrawingStroke'

    LessonNoteCreate:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        at_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Moment of the lesson video the note refers to, or `null` for the whole lesson.
        student_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: The student the note is for, or `null` for all of them.
        drawing:
          oneOf:
            - $ref: '#/components/schemas/Drawing'
            - type: 'null'
          description: Requires `at_ms`.
        is_plan:
          type: boolean
          description: True marks the note as a plan item for the next lessons.
        visible_to_students:
          type: boolean
          description: Defaults to true.

    LessonNote:
      type: object
      required:
        - id
        - lesson_id
        - text
        - at_ms
        - student_id
        - drawing
        - is_plan
        - visible_to_students
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        lesson_id:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
        at_ms:
          type:
            - integer
            - 'null'
          minimum: 0
        student_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        drawing:
          oneOf:
            - $ref: '#/components/schemas/Drawing'
            - type: 'null'
        is_plan:
          type: boolean
        visible_to_students:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'

    CoachAccess:
      type: string
      description: |
        What the student shares with the coach: `lessons_only` (the lessons this coach taught)
        or `matches_and_lessons` (also their matches and stats, section 12).
      enum: [lessons_only, matches_and_lessons]

    CoachStudent:
      type: object
      required: [user, access, lessons_count, last_lesson_at, pending_payment_cents]
      properties:
        user:
          $ref: '#/components/schemas/EntityRef'
        access:
          $ref: '#/components/schemas/CoachAccess'
        lessons_count:
          type: integer
          minimum: 0
        last_lesson_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        pending_payment_cents:
          $ref: '#/components/schemas/AmountCents'

    CoachStudentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CoachStudent'

    PaymentConcept:
      type: string
      description: |
        `payments.concept`. Players pay `deposit`, `player_extra` and `lesson` through checkout;
        `subscription` is the club's monthly fee, charged by a Mercado Pago subscription in our
        company's name (never through checkout).
      enum: [deposit, player_extra, lesson, subscription]

    CheckoutDeposit:
      type: object
      required: [concept, booking_id]
      additionalProperties: false
      properties:
        concept:
          type: string
          const: deposit
        booking_id:
          $ref: '#/components/schemas/Uuid'

    CheckoutPlayerExtra:
      type: object
      required: [concept, match_id]
      additionalProperties: false
      properties:
        concept:
          type: string
          const: player_extra
        match_id:
          $ref: '#/components/schemas/Uuid'

    CheckoutLesson:
      type: object
      required: [concept, lesson_id]
      additionalProperties: false
      properties:
        concept:
          type: string
          const: lesson
        lesson_id:
          $ref: '#/components/schemas/Uuid'

    CheckoutRequest:
      description: What is being paid. The amount comes from the server, never from the client.
      oneOf:
        - $ref: '#/components/schemas/CheckoutDeposit'
        - $ref: '#/components/schemas/CheckoutPlayerExtra'
        - $ref: '#/components/schemas/CheckoutLesson'
      discriminator:
        propertyName: concept
        mapping:
          deposit: '#/components/schemas/CheckoutDeposit'
          player_extra: '#/components/schemas/CheckoutPlayerExtra'
          lesson: '#/components/schemas/CheckoutLesson'

    Checkout:
      type: object
      required:
        - payment_id
        - concept
        - status
        - amount_cents
        - marketplace_fee_cents
        - payee
        - checkout_url
        - expires_at
      properties:
        payment_id:
          $ref: '#/components/schemas/Uuid'
        concept:
          $ref: '#/components/schemas/PaymentConcept'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        marketplace_fee_cents:
          $ref: '#/components/schemas/AmountCents'
        payee:
          type: string
          description: |
            Whose Mercado Pago account receives the money: the `club`, the `coach`, or
            `platform` when the club or coach has not connected an account yet (we transfer in
            the monthly settlement).
          enum: [club, coach, platform]
        checkout_url:
          type: string
          format: uri
          description: Mercado Pago checkout (`init_point`) to open in the browser or app.
        expires_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: For deposits, the end of the 10-minute hold.

    MercadoPagoNotification:
      type: object
      description: |
        Body Mercado Pago sends (webhooks v1). Only `type` and `data.id` are used; amounts and
        status are always read back from Mercado Pago's API.
      required: [type, data]
      properties:
        id:
          type: integer
        live_mode:
          type: boolean
        type:
          type: string
          examples: [payment]
        date_created:
          type: string
        user_id:
          type: integer
        api_version:
          type: string
        action:
          type: string
          examples: [payment.created, payment.updated]
        data:
          type: object
          required: [id]
          properties:
            id:
              type: string
    ClubPlan:
      type: string
      description: |
        How the club got the camera kit: `loan` (comodato, we keep ownership) or `purchase`.
        Set by the contract with us; read-only for the club.
      enum: [loan, purchase]

    ClubSummary:
      type: object
      description: A club in the public list.
      required: [id, name, address, city, logo_url, courts_count]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 80
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        courts_count:
          type: integer
          minimum: 0

    ClubSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClubSummary'

    Club:
      type: object
      description: Public detail of a club with its courts and settings.
      required:
        - id
        - name
        - address
        - city
        - timezone
        - logo_url
        - sponsor_name
        - plan
        - courts
        - charges
        - modules
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 120
        address:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 80
        timezone:
          type: string
          description: IANA time zone of the club. Booking rule hours are local times in this zone.
          examples:
            - America/Argentina/Buenos_Aires
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        sponsor_name:
          type:
            - string
            - 'null'
          maxLength: 120
        plan:
          $ref: '#/components/schemas/ClubPlan'
        courts:
          type: array
          items:
            $ref: '#/components/schemas/Court'
        charges:
          $ref: '#/components/schemas/ChargeSettings'
        modules:
          $ref: '#/components/schemas/AdminModules'
          description: Modules active for the club (SA-05). Apps and panels hide what is off; its endpoints answer `CLUB_FEATURE_DISABLED`. Only internal staff change them (`PUT /admin/clubs/{id}/modules`).

    CourtStatus:
      type: string
      description: |
        `active` takes bookings; `maintenance` is temporarily closed (no new bookings);
        `inactive` is out of service.
      enum: [active, maintenance, inactive]

    Court:
      type: object
      required: [id, name, covered, status, booking]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 60
        covered:
          type: boolean
          description: True for an indoor (techada) court.
        status:
          $ref: '#/components/schemas/CourtStatus'
        booking:
          $ref: '#/components/schemas/CourtBookingSettings'

    Weekday:
      type: string
      enum: [mon, tue, wed, thu, fri, sat, sun]

    LocalTime:
      type: string
      description: |
        Local time `HH:MM` in the club's time zone. `24:00` is allowed as an end time and means
        midnight at the end of the day.
      pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
      examples:
        - '18:00'

    BookingDuration:
      type: integer
      description: Allowed booking length in minutes.
      enum: [60, 90, 120]

    DurationPrice:
      type: object
      required: [duration_minutes, amount_cents]
      properties:
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'

    PriceBand:
      type: object
      description: |
        Price of a booking that starts in `[starts_at, ends_at)`, for example peak hours from
        18:00 to 23:00. The bands of a rule must cover its opening hours without gaps or
        overlaps, and have a price for every allowed duration.
      required: [starts_at, ends_at, prices]
      properties:
        starts_at:
          $ref: '#/components/schemas/LocalTime'
        ends_at:
          $ref: '#/components/schemas/LocalTime'
        prices:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/DurationPrice'

    BookingRule:
      type: object
      description: |
        Opening hours of a court on some weekdays (`booking_slots_rules`). A booking must start
        on a step of `start_interval_minutes` from `opens_at` and end by `closes_at`. Rules of
        one court must not overlap on the same day.
      required: [days, opens_at, closes_at, allowed_durations, start_interval_minutes, price_bands]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        opens_at:
          $ref: '#/components/schemas/LocalTime'
        closes_at:
          $ref: '#/components/schemas/LocalTime'
        allowed_durations:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BookingDuration'
        start_interval_minutes:
          type: integer
          enum: [15, 30, 60]
          default: 30
          description: Every how many minutes a booking may start (30 by default).
        price_bands:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/PriceBand'

    DepositNone:
      type: object
      description: No deposit; the booking is confirmed right away.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [none]

    DepositPercent:
      type: object
      description: Deposit as a percent of the booking price, rounded down to whole cents.
      required: [type, percent]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [percent]
        percent:
          type: integer
          minimum: 1
          maximum: 100

    DepositFixed:
      type: object
      description: Fixed deposit amount in ARS cents, capped at the booking price.
      required: [type, amount_cents]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [fixed]
        amount_cents:
          type: integer
          minimum: 1

    Deposit:
      description: Deposit asked to confirm a booking, paid with Mercado Pago (section 9).
      oneOf:
        - $ref: '#/components/schemas/DepositNone'
        - $ref: '#/components/schemas/DepositPercent'
        - $ref: '#/components/schemas/DepositFixed'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/DepositNone'
          percent: '#/components/schemas/DepositPercent'
          fixed: '#/components/schemas/DepositFixed'

    CourtBookingSettings:
      type: object
      description: Booking rules, deposit and cancellation policy of one court.
      required: [rules, deposit, cancellation_refund_hours]
      additionalProperties: false
      properties:
        rules:
          type: array
          description: Empty means the court takes no bookings from the app.
          maxItems: 14
          items:
            $ref: '#/components/schemas/BookingRule'
        deposit:
          $ref: '#/components/schemas/Deposit'
        cancellation_refund_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: |
            Cancelling at least this many hours before the start refunds the deposit (24 by
            default). Later cancellations and `no_show` keep it.

    PlayerExtraSettings:
      type: object
      description: |
        Per-match extra charged to each player to unlock the full analysis (`player_extra`
        payments). The money goes to the club's Mercado Pago account.
      required: [enabled, amount_cents]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False means everything is free for players.
        amount_cents:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Price per player and match in ARS cents. Required when `enabled` is true.

    CoachPlan:
      type: object
      description: |
        Who pays for the coach tools: `included` in the club's subscription, or
        `coach_monthly`, a monthly fee each coach pays.
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [included, coach_monthly]
        monthly_fee_cents:
          type: integer
          minimum: 1
          description: Monthly fee per coach in ARS cents. Required when `type` is `coach_monthly`.

    ChargeSettings:
      type: object
      description: How the club charges players and coaches (section 10).
      required: [player_extra, coach_plan, lesson_payments_enabled]
      additionalProperties: false
      properties:
        player_extra:
          $ref: '#/components/schemas/PlayerExtraSettings'
        coach_plan:
          $ref: '#/components/schemas/CoachPlan'
        lesson_payments_enabled:
          type: boolean
          description: True lets the club's coaches charge their lessons in the app (`lesson` payments).

    CourtSettingsUpdate:
      type: object
      required: [court_id, booking]
      additionalProperties: false
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        booking:
          $ref: '#/components/schemas/CourtBookingSettings'

    ClubSettingsUpdate:
      type: object
      description: Settings the owner may change. At least one field is required.
      minProperties: 1
      additionalProperties: false
      properties:
        charges:
          $ref: '#/components/schemas/ChargeSettings'
        courts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CourtSettingsUpdate'

    AvailabilitySlot:
      type: object
      description: A free start time for the requested duration.
      required: [starts_at, ends_at, amount_cents, deposit_cents]
      properties:
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        deposit_cents:
          $ref: '#/components/schemas/AmountCents'

    CourtAvailability:
      type: object
      required: [court_id, date, timezone, duration_minutes, slots]
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        date:
          type: string
          format: date
          description: Local day asked for, in the club's time zone.
        timezone:
          type: string
          description: IANA time zone of the club.
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    GuardianRelationship:
      type: string
      enum: [mother, father, guardian]

    GuardianConsent:
      type: object
      description: |
        Permission of a parent or legal guardian to record a minor's turn (section 12). Sending
        it means the guardian accepted the given version of the consent text; the server stores
        who, the version and the time. Only the club's staff and the player see it.
      required: [guardian_name, guardian_phone, relationship, consent_version]
      additionalProperties: false
      properties:
        guardian_name:
          type: string
          minLength: 1
          maxLength: 120
        guardian_phone:
          $ref: '#/components/schemas/PhoneNumber'
        relationship:
          $ref: '#/components/schemas/GuardianRelationship'
        consent_version:
          type: string
          minLength: 1
          maxLength: 32
          description: Version of the consent text the guardian accepted, e.g. `2026-10-01`.

    BookingRecurrence:
      type: object
      description: Fixed weekly turn on the same weekday and local time, generated 8 weeks ahead.
      required: [frequency, weeks_ahead]
      additionalProperties: false
      properties:
        frequency:
          type: string
          enum: [weekly]
        weeks_ahead:
          type: integer
          enum: [8]
          description: Weeks generated ahead, renewed every week (section 9).

    BookingCreate:
      type: object
      required: [court_id, starts_at, duration_minutes]
      additionalProperties: false
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        recurrence:
          $ref: '#/components/schemas/BookingRecurrence'
        no_record:
          type: boolean
          default: false
          description: True marks the turn as "do not record" on purpose.
        guardian_consent:
          $ref: '#/components/schemas/GuardianConsent'

    BookingSource:
      type: string
      description: Where the booking was made.
      enum: [app, panel]

    NoRecordReason:
      type: string
      description: |
        Why the turn will not be recorded: `requested` by the booker, a `club_school` marked by
        the club, or a `minor_without_guardian` (section 12).
      enum: [requested, club_school, minor_without_guardian]

    BookingPlayer:
      type: object
      description: A position of the booking. Position 1 is who booked.
      required: [position, user, accepted, guardian_consent_on_file]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 4
        user:
          description: The player, or `null` while the position is free or the invite is pending.
          oneOf:
            - $ref: '#/components/schemas/EntityRef'
            - type: 'null'
        accepted:
          type: boolean
        guardian_consent_on_file:
          type: boolean
          description: True when a guardian permission is loaded for this player (minors only).

    BookingSeries:
      type: object
      description: The fixed weekly rule an occurrence belongs to.
      required: [id, weeks_ahead, skipped_starts]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        weeks_ahead:
          type: integer
          enum: [8]
        skipped_starts:
          type: array
          description: Starts of the next weeks not generated because the slot was taken.
          items:
            $ref: '#/components/schemas/Timestamp'

    Booking:
      type: object
      required:
        - id
        - club_id
        - court_id
        - starts_at
        - ends_at
        - duration_minutes
        - status
        - hold_expires_at
        - price_cents
        - deposit_cents
        - deposit_paid_cents
        - cancellation_refund_hours
        - source
        - players
        - no_record
        - no_record_reason
        - series
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club_id:
          $ref: '#/components/schemas/Uuid'
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        ends_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        status:
          $ref: '#/components/schemas/BookingStatus'
        hold_expires_at:
          description: When a `held` booking expires (10 minutes after creation); `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        price_cents:
          $ref: '#/components/schemas/AmountCents'
        deposit_cents:
          $ref: '#/components/schemas/AmountCents'
        deposit_paid_cents:
          $ref: '#/components/schemas/AmountCents'
        cancellation_refund_hours:
          type: integer
          minimum: 0
          maximum: 168
          description: Court policy copied when the booking was created; later changes do not apply.
        source:
          $ref: '#/components/schemas/BookingSource'
        players:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/BookingPlayer'
        no_record:
          type: boolean
          description: True means the club device will not record this turn.
        no_record_reason:
          oneOf:
            - $ref: '#/components/schemas/NoRecordReason'
            - type: 'null'
        series:
          oneOf:
            - $ref: '#/components/schemas/BookingSeries'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BookingInviteRequest:
      type: object
      additionalProperties: false
      properties:
        position:
          type: integer
          minimum: 2
          maximum: 4
          description: Position to invite to. Omitted means the lowest free one.

    BookingInvite:
      type: object
      required: [booking_id, position, token, url, expires_at]
      properties:
        booking_id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 2
          maximum: 4
        token:
          type: string
          minLength: 8
          maxLength: 128
          description: Single-use invite token.
        url:
          type: string
          format: uri
          description: Link to share by WhatsApp; opens the app or the web on the invite.
        expires_at:
          $ref: '#/components/schemas/Timestamp'

    BookingAcceptRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 8
          maxLength: 128
        guardian_consent:
          $ref: '#/components/schemas/GuardianConsent'

    BookingCancelScope:
      type: string
      description: '`series` also cancels the later occurrences of a fixed weekly booking.'
      enum: [this, series]

    BookingCancelRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/BookingCancelScope'

    RefundStatus:
      type: string
      description: |
        `none` when the deposit is kept or there was none; `pending` until Mercado Pago confirms
        the refund.
      enum: [none, pending]

    BookingCancellation:
      type: object
      required:
        - booking_id
        - status
        - cancelled_at
        - refund_cents
        - refund_status
        - cancelled_booking_ids
      properties:
        booking_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/BookingStatus'
        cancelled_at:
          $ref: '#/components/schemas/Timestamp'
        refund_cents:
          $ref: '#/components/schemas/AmountCents'
        refund_status:
          $ref: '#/components/schemas/RefundStatus'
        cancelled_booking_ids:
          type: array
          description: Every booking cancelled by the request (more than one with `scope` `series`).
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'

    # Club admin panel (sections 11 and 12). Staff see bookings, cameras and matches without
    # personal stats; the owner also sees revenue and settlements.
    CourtLiveStatus:
      type: string
      description: |
        `recording` (a turn is being recorded), `idle`, `camera_offline` (one or both cameras
        down) or `maintenance` (court not active).
      enum: [recording, idle, camera_offline, maintenance]

    CameraEnd:
      type: string
      description: End of the court where the camera is mounted (section 5).
      enum: [A, B]

    CameraState:
      type: object
      required: [end, online]
      properties:
        end:
          $ref: '#/components/schemas/CameraEnd'
        online:
          type: boolean

    CourtLive:
      type: object
      required: [court, status, cameras, current_match_id, current_until, next_booking_at]
      properties:
        court:
          $ref: '#/components/schemas/EntityRef'
        status:
          $ref: '#/components/schemas/CourtLiveStatus'
        cameras:
          type: array
          items:
            $ref: '#/components/schemas/CameraState'
        current_match_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        current_until:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Scheduled end of the current recording.
        next_booking_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    DeviceHealthSummary:
      type: object
      description: Last heartbeat of a club device (section 4, `health`).
      required: [device_id, online, last_seen_at, disk_free_pct, gpu_temp_c, upload_queue_minutes]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        online:
          type: boolean
          description: False when no heartbeat arrived in the last 3 minutes.
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        disk_free_pct:
          type: number
          minimum: 0
          maximum: 100
        gpu_temp_c:
          type:
            - number
            - 'null'
        upload_queue_minutes:
          type: integer
          minimum: 0
          description: Estimated minutes to empty the upload queue.

    PricingTier:
      type: object
      description: |
        Band of active players (distinct players with at least one recorded match in the club in
        the last 90 days) that sets the monthly subscription (decision of 21/10/2026, #253).
        Bands and prices live in the contract with the club; see `docs/pendientes.md`.
      required: [name, min_active_players, max_active_players]
      properties:
        name:
          type: string
        min_active_players:
          type: integer
          minimum: 0
        max_active_players:
          type:
            - integer
            - 'null'
          minimum: 1
          description: '`null` for the top band.'

    ClubBillingSummary:
      type: object
      description: Owner only. Where the club stands on its subscription this month.
      required: [active_players_90d, tier, subscription_cents, debt_cents]
      properties:
        active_players_90d:
          type: integer
          minimum: 0
        tier:
          $ref: '#/components/schemas/PricingTier'
        subscription_cents:
          $ref: '#/components/schemas/AmountCents'
        debt_cents:
          $ref: '#/components/schemas/AmountCents'
          description: Unpaid subscription; shown after 15 days, service cut at 30 (section 10).

    ClubRevenueSummary:
      type: object
      description: Owner only. Money of the day, in ARS cents.
      required: [bookings_cents, deposits_cents, player_extras_cents]
      properties:
        bookings_cents:
          $ref: '#/components/schemas/AmountCents'
        deposits_cents:
          $ref: '#/components/schemas/AmountCents'
        player_extras_cents:
          $ref: '#/components/schemas/AmountCents'

    ClubDashboard:
      type: object
      required:
        - club_id
        - date
        - bookings_count
        - occupancy_pct
        - matches_published
        - matches_failed
        - courts
        - devices
        - revenue
        - billing
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        date:
          type: string
          format: date
        bookings_count:
          type: integer
          minimum: 0
        occupancy_pct:
          type: number
          minimum: 0
          maximum: 100
          description: Booked minutes over open minutes of every active court.
        matches_published:
          type: integer
          minimum: 0
        matches_failed:
          type: integer
          minimum: 0
        courts:
          type: array
          items:
            $ref: '#/components/schemas/CourtLive'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceHealthSummary'
        revenue:
          oneOf:
            - $ref: '#/components/schemas/ClubRevenueSummary'
            - type: 'null'
          description: '`null` for staff.'
        billing:
          oneOf:
            - $ref: '#/components/schemas/ClubBillingSummary'
            - type: 'null'
          description: '`null` for staff.'

    ClubBookingContact:
      type: object
      description: Who booked, so the front desk can reach them. No stats.
      required: [user_id, name, phone, account_pending]
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type:
            - string
            - 'null'
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneNumber'
            - type: 'null'
        account_pending:
          type: boolean
          description: True when the account was created from the panel and not activated yet.

    ClubBooking:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required: [court_name, booker, match_id]
          properties:
            court_name:
              type: string
            booker:
              $ref: '#/components/schemas/ClubBookingContact'
            match_id:
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'
              description: The recorded match, once recording started.

    ClubBookingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClubBooking'

    ClubPlayerSegment:
      type: string
      enum: [frequent, dormant, no_show]
      description: |
        Saved segments of the club. `frequent`: played in at least 4 of the last 8 weeks.
        `dormant`: last visit more than 30 days ago (or never came). `no_show`: 2 or more
        no-shows.

    ClubPlayer:
      type: object
      required:
        - user_id
        - name
        - phone
        - email
        - bookings_per_month
        - active_weeks
        - weeks_window
        - no_shows
        - last_visit_at
        - total_spend_cents
        - segments
        - tags
        - notes
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        phone:
          oneOf:
            - $ref: '#/components/schemas/PhoneNumber'
            - type: 'null'
        email:
          type:
            - string
            - 'null'
        bookings_per_month:
          type: number
          description: Frequency. Bookings played in the last 8 weeks, scaled to 30 days, one decimal.
        active_weeks:
          type: integer
          minimum: 0
          maximum: 8
          description: Recurrence. Weeks (out of `weeks_window`) with at least one booking played.
        weeks_window:
          type: integer
          enum: [8]
        no_shows:
          type: integer
          minimum: 0
          description: Bookings the person made and did not show up for, all time.
        last_visit_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        total_spend_cents:
          type:
            - integer
            - 'null'
          description: Approved payments minus refunds at this club. `null` for staff.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ClubPlayerSegment'
        tags:
          type: array
          items:
            type: string
        notes:
          type:
            - string
            - 'null'

    ClubPlayerPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClubPlayer'

    ClubPlayerVisit:
      type: object
      required: [booking_id, starts_at, court_name, status, price_cents]
      properties:
        booking_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        court_name:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        price_cents:
          type: integer

    ClubPlayerDetail:
      allOf:
        - $ref: '#/components/schemas/ClubPlayer'
        - type: object
          required: [recent_bookings]
          properties:
            recent_bookings:
              type: array
              description: Latest 20 bookings at this club, newest first.
              items:
                $ref: '#/components/schemas/ClubPlayerVisit'

    ClubPlayerNotesUpdate:
      type: object
      required: [tags, notes]
      additionalProperties: false
      properties:
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
        notes:
          type:
            - string
            - 'null'
          maxLength: 1000

    CashPaymentMethod:
      type: string
      enum: [cash, transfer, card, mercado_pago]

    CashMovement:
      type: object
      required: [id, kind, method, amount_cents, description, occurred_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum: [income, expense]
        method:
          $ref: '#/components/schemas/CashPaymentMethod'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        description:
          type: string
          maxLength: 200
        booking_id:
          description: Booking the income belongs to, if any.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'

    CashMethodTotal:
      type: object
      required: [method, income_cents]
      properties:
        method:
          $ref: '#/components/schemas/CashPaymentMethod'
        income_cents:
          $ref: '#/components/schemas/AmountCents'

    CashRegister:
      type: object
      required:
        - club_id
        - date
        - status
        - movements
        - totals_by_method
        - expenses_cents
        - expected_cash_cents
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        date:
          type: string
          format: date
        status:
          type: string
          enum: [open, closed]
        movements:
          type: array
          items:
            $ref: '#/components/schemas/CashMovement'
        totals_by_method:
          type: array
          items:
            $ref: '#/components/schemas/CashMethodTotal'
        expenses_cents:
          $ref: '#/components/schemas/AmountCents'
        expected_cash_cents:
          type: integer
          description: Cash income minus expenses.
        counted_cash_cents:
          description: Set once closed.
          oneOf:
            - $ref: '#/components/schemas/AmountCents'
            - type: 'null'
        difference_cents:
          description: Counted minus expected. Set once closed.
          oneOf:
            - type: integer
            - type: 'null'
        closed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        pdf_url:
          description: Signed link to the closing PDF (1 hour). Set once closed.
          oneOf:
            - type: string
              format: uri
            - type: 'null'

    CashExpenseCreate:
      type: object
      required: [date, amount_cents, description]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        amount_cents:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
          maxLength: 200

    CashRegisterClose:
      type: object
      required: [date, counted_cash_cents]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        counted_cash_cents:
          $ref: '#/components/schemas/AmountCents'

    ClubBookingCreate:
      type: object
      required: [court_id, starts_at, duration_minutes, phone]
      additionalProperties: false
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        duration_minutes:
          $ref: '#/components/schemas/BookingDuration'
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        name:
          type: string
          maxLength: 80
          description: Name for a new pending account. Ignored if the phone has an account.
        deposit:
          type: string
          description: '`none` or `paid_at_club` (cash or transfer at the desk). Defaults to `none`.'
          enum: [none, paid_at_club]
        recurrence:
          $ref: '#/components/schemas/BookingRecurrence'
        no_record:
          type: boolean
          description: Marks the turn "do not record" (for example an escuelita).

    RecordingStop:
      type: object
      required: [court_id, match_id, match_status, stopped_at]
      properties:
        court_id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
        match_status:
          $ref: '#/components/schemas/MatchStatus'
        stopped_at:
          $ref: '#/components/schemas/Timestamp'

    SettlementSubscription:
      type: object
      required: [active_players_90d, tier, amount_cents]
      properties:
        active_players_90d:
          type: integer
          minimum: 0
          description: Active players at the close of the period.
        tier:
          $ref: '#/components/schemas/PricingTier'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'

    Settlement:
      type: object
      description: |
        Monthly summary of a club (section 10). All amounts in ARS cents.
        `net_payable_by_club_cents` = subscription + commissions minus `collected_by_platform_cents`
        (money we collected because the club had not connected its Mercado Pago account, which
        we owe the club), floored at 0; when we owe more than the club does, we transfer the
        difference to the club.
      required:
        - id
        - period
        - status
        - subscription
        - player_payments_cents
        - lesson_payments_cents
        - deposits_cents
        - commissions_cents
        - collected_by_platform_cents
        - net_payable_by_club_cents
        - invoice_number
        - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Month, `YYYY-MM`.
        status:
          $ref: '#/components/schemas/SettlementStatus'
        subscription:
          $ref: '#/components/schemas/SettlementSubscription'
        player_payments_cents:
          $ref: '#/components/schemas/AmountCents'
        lesson_payments_cents:
          $ref: '#/components/schemas/AmountCents'
        deposits_cents:
          $ref: '#/components/schemas/AmountCents'
        commissions_cents:
          $ref: '#/components/schemas/AmountCents'
        collected_by_platform_cents:
          $ref: '#/components/schemas/AmountCents'
        net_payable_by_club_cents:
          $ref: '#/components/schemas/AmountCents'
        invoice_number:
          type:
            - string
            - 'null'
          description: ARCA invoice number, once `invoiced`.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    SettlementPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Settlement'
    Page:
      type: object
      description: |
        Base of every paginated response. A list operation combines it with `allOf` and adds an
        `items` array of its own type.
      required:
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: Cursor for the next page, or `null` on the last page.

    Error:
      type: object
      description: Body of every 4xx and 5xx response.
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Short text for the end user, in es-AR, from the API translation files.
        details:
          type: object
          additionalProperties: true
          description: Optional machine-readable detail. Shape per code in the `ErrorCode` catalog.
      examples:
        - code: BOOKING_SLOT_TAKEN
          message: Ese turno se acaba de ocupar. Elegí otro horario.
          details:
            court_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
            starts_at: '2026-10-17T21:30:00Z'

    ValidationIssue:
      type: object
      description: One invalid field, used in `details.issues` of `VALIDATION_FAILED`.
      required:
        - path
        - rule
      properties:
        path:
          type: string
          description: JSON pointer or parameter name of the invalid value, e.g. `/players/0/phone`.
        rule:
          type: string
          description: Machine-readable rule that failed, e.g. `required`, `max`, `format`.

    ErrorCode:
      type: string
      description: |
        Stable error codes. The catalog in `x-error-catalog` gives the HTTP status, the meaning
        and the `details` shape of each one. Codes are only added, never renamed or reused.
      pattern: '^[A-Z][A-Z0-9_]*$'
      enum:
        # Common
        - VALIDATION_FAILED
        - INVALID_CURSOR
        - UNAUTHENTICATED
        - ACCESS_TOKEN_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        # Auth and users
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_ATTEMPTS_EXCEEDED
        - REFRESH_TOKEN_INVALID
        - TERMS_NOT_ACCEPTED
        # Clubs
        - CLUB_FEATURE_DISABLED
        - CLUB_SERVICE_SUSPENDED
        # Bookings
        - BOOKING_SLOT_TAKEN
        - BOOKING_SLOT_INVALID
        - BOOKING_HOLD_EXPIRED
        - BOOKING_FULL
        - BOOKING_INVITE_INVALID
        # Matches and media
        - MATCH_NOT_PUBLISHED
        - MATCH_PLAYER_SLOT_TAKEN
        - MATCH_ALREADY_JOINED
        - MEDIA_NOT_READY
        - MEDIA_EXPIRED
        # Coaches
        - COACH_ACCESS_NOT_GRANTED
        # Payments
        - PAYMENT_PROVIDER_ERROR
        - WEBHOOK_SIGNATURE_INVALID
        # Club panel and device
        - RECORDING_NOT_ACTIVE
        - DEVICE_CERTIFICATE_INVALID
        - DEVICE_CLUB_MISMATCH
        # Internal console
        - TARIFF_VERSION_NOT_FOUND
        - TARIFF_TIERS_INVALID
        - CLUB_TAX_ID_TAKEN
        - PAYMENT_ALREADY_RECORDED
        - SUPPORT_ACCESS_NOT_GRANTED
        # Tournaments
        - TOURNAMENT_REGISTRATION_CLOSED
        - TOURNAMENT_PLAYER_TAKEN
        - TOURNAMENT_PAIR_COUNT_INVALID
        - TOURNAMENT_NOT_ENOUGH_SLOTS
      x-error-catalog:
        - code: VALIDATION_FAILED
          http_status: 400
          description: The request is malformed or a field breaks its schema (Zod at the edge).
          details: '`issues`: array of `ValidationIssue`.'
        - code: INVALID_CURSOR
          http_status: 400
          description: The pagination cursor is malformed, expired or from another list.
        - code: UNAUTHENTICATED
          http_status: 401
          description: No access token, or the token is not valid.
        - code: ACCESS_TOKEN_EXPIRED
          http_status: 401
          description: The access token expired. Renew it with the refresh token and retry.
        - code: FORBIDDEN
          http_status: 403
          description: The caller's role does not allow this action (section 12 permissions).
        - code: NOT_FOUND
          http_status: 404
          description: The resource does not exist or belongs to another club.
          details: '`resource`: resource type, e.g. `booking`.'
        - code: INVALID_STATE_TRANSITION
          http_status: 409
          description: The entity cannot move to the requested status from its current one.
          details: '`entity`, `from` and `to` statuses.'
        - code: RATE_LIMITED
          http_status: 429
          description: More than 60 requests per minute. Wait for `Retry-After` seconds.
        - code: INTERNAL_ERROR
          http_status: 500
          description: Unexpected server error. The detail is in the log under `X-Request-Id`.
        - code: SERVICE_UNAVAILABLE
          http_status: 503
          description: The API or a dependency is temporarily down. Safe to retry later.
        - code: OTP_INVALID
          http_status: 401
          description: The WhatsApp code is wrong.
          details: '`attempts_remaining`: integer.'
        - code: OTP_EXPIRED
          http_status: 401
          description: The WhatsApp code is older than 5 minutes. Request a new one.
        - code: OTP_ATTEMPTS_EXCEEDED
          http_status: 401
          description: Five wrong attempts for this code. Request a new one.
        - code: REFRESH_TOKEN_INVALID
          http_status: 401
          description: The refresh token is expired, revoked or was already used. Sign in again.
        - code: TERMS_NOT_ACCEPTED
          http_status: 403
          description: The user has not accepted the terms and privacy policy (Ley 25.326).
        - code: CLUB_FEATURE_DISABLED
          http_status: 403
          description: The club has not enabled this feature or paid extra.
          details: '`feature`: feature key.'
        - code: CLUB_SERVICE_SUSPENDED
          http_status: 403
          description: The club's service is cut for 30 days of unpaid subscription.
        - code: BOOKING_SLOT_TAKEN
          http_status: 409
          description: Another held or confirmed booking overlaps the slot (exclusion constraint).
          details: '`court_id`, `starts_at`.'
        - code: BOOKING_SLOT_INVALID
          http_status: 422
          description: The slot breaks the court rules (opening hours, duration or start step).
        - code: BOOKING_HOLD_EXPIRED
          http_status: 409
          description: The 10-minute hold expired before the deposit was paid; the slot was released.
        - code: BOOKING_FULL
          http_status: 409
          description: The booking already has its 4 players.
        - code: BOOKING_INVITE_INVALID
          http_status: 422
          description: The invite link is invalid, already used or the booking is no longer active.
        - code: MATCH_NOT_PUBLISHED
          http_status: 409
          description: The action needs a published match (clips, score correction, downloads).
        - code: MATCH_PLAYER_SLOT_TAKEN
          http_status: 409
          description: Another user already claimed that player position in the match.
        - code: MATCH_ALREADY_JOINED
          http_status: 409
          description: The user is already a player in this match.
        - code: MEDIA_NOT_READY
          http_status: 409
          description: The video or clip is still being processed or uploaded.
        - code: MEDIA_EXPIRED
          http_status: 410
          description: The media was deleted (full videos are deleted after 30 days).
        - code: COACH_ACCESS_NOT_GRANTED
          http_status: 403
          description: The student has not given this coach access to their matches or lessons.
        - code: PAYMENT_PROVIDER_ERROR
          http_status: 502
          description: Mercado Pago failed or rejected the request. Safe to retry later.
        - code: WEBHOOK_SIGNATURE_INVALID
          http_status: 401
          description: The Mercado Pago webhook `x-signature` does not verify.
        - code: RECORDING_NOT_ACTIVE
          http_status: 409
          description: The court is not recording, so there is nothing to stop.
        - code: DEVICE_CERTIFICATE_INVALID
          http_status: 401
          description: The club device client certificate is missing, expired or revoked (mTLS).
        - code: DEVICE_CLUB_MISMATCH
          http_status: 403
          description: The device tried to act on a match, court or upload of another club.
        - code: TARIFF_VERSION_NOT_FOUND
          http_status: 404
          description: The tariff version does not exist.
        - code: TARIFF_TIERS_INVALID
          http_status: 422
          description: The bands of a tariff version have gaps, overlaps or no open top band.
        - code: CLUB_TAX_ID_TAKEN
          http_status: 409
          description: Another club already has this CUIT.
        - code: PAYMENT_ALREADY_RECORDED
          http_status: 409
          description: A manual payment with the same reference was already recorded for this club.
        - code: SUPPORT_ACCESS_NOT_GRANTED
          http_status: 403
          description: No unexpired support permission is registered in `audit_log` for this match.
        - code: TOURNAMENT_REGISTRATION_CLOSED
          http_status: 409
          description: The draw was already made (or the tournament ended), so pairs can no longer join or leave.
        - code: TOURNAMENT_PLAYER_TAKEN
          http_status: 409
          description: One of the two players is already in an active pair of this tournament.
        - code: TOURNAMENT_PAIR_COUNT_INVALID
          http_status: 422
          description: The pairs cannot be split into groups of 3 or 4 (fewer than 3, or exactly 5).
        - code: TOURNAMENT_NOT_ENOUGH_SLOTS
          http_status: 422
          description: The courts and the window do not fit every match of the fixture.

    # Internal console (SA-03 to SA-08, 21/10/2026 specification). Roles are internal staff
    # (admin, sales, support, finance), never club or player roles.
    AdminClubStatus:
      type: string
      description: |
        Commercial status of a club. `trial` and `active` are healthy, `overdue` keeps service
        while the subscription is unpaid (reminder at day 15), `suspended` cuts service (day 30 or
        by hand), `closed` is a club that left. Moves between states are done by the endpoints
        that name them; any other change returns `INVALID_STATE_TRANSITION`.
      enum: [trial, active, overdue, suspended, closed]

    AdminTierUsage:
      type: object
      description: Where a club stands against the active-player bands of its tariff version.
      required: [active_players_90d, tier, next_tier_at]
      properties:
        active_players_90d:
          type: integer
          minimum: 0
        tier:
          $ref: '#/components/schemas/PricingTier'
        next_tier_at:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Active players at which the club moves up a band; `null` in the top band.

    AdminClubRow:
      type: object
      description: One club in the console list.
      required: [id, name, city, status, plan, tier, balance_cents, last_payment_at, overdue_days]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        city:
          type: string
        status:
          $ref: '#/components/schemas/AdminClubStatus'
        plan:
          $ref: '#/components/schemas/ClubPlan'
        tier:
          $ref: '#/components/schemas/PricingTier'
        balance_cents:
          type: integer
          description: Positive is what the club owes, negative is credit. ARS cents.
        last_payment_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        overdue_days:
          type: integer
          minimum: 0
          description: Days since the oldest unpaid invoice was due; 0 when up to date.

    AdminClubPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminClubRow'

    AdminLegalData:
      type: object
      description: Legal and contact data of the club (SA-03a).
      required: [legal_name, tax_id, contact_name, contact_phone, contact_email, address, city]
      additionalProperties: false
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 160
        tax_id:
          type: string
          pattern: '^\d{11}$'
          description: CUIT, 11 digits without hyphens. Unique across clubs.
        contact_name:
          type: string
          maxLength: 120
        contact_phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          description: E.164.
        contact_email:
          type: string
          maxLength: 254
          description: Email address.
        address:
          type: string
          maxLength: 200
          description: Street address; the API geocodes it.
        city:
          type: string
          maxLength: 80

    AdminClubUpdate:
      type: object
      description: Fields of a club the console may change. At least one is required.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        legal:
          $ref: '#/components/schemas/AdminLegalData'
        plan:
          $ref: '#/components/schemas/ClubPlan'

    AdminClubStatusChange:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Why. Stored in `audit_log`.

    DepositModule:
      type: object
      description: Deposit (seña) charged when a player books.
      required: [enabled, kind, percent, amount_cents]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        kind:
          type: string
          enum: [percent, fixed]
        percent:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 100
          description: Required when `kind` is `percent`.
        amount_cents:
          oneOf:
            - $ref: '#/components/schemas/AmountCents'
            - type: 'null'
          description: Required when `kind` is `fixed`.

    BrandingModule:
      type: object
      description: Club white-label look.
      required: [mode, logo_url, primary_color, secondary_color]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [own, generic]
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        primary_color:
          type:
            - string
            - 'null'
          pattern: '^#[0-9A-Fa-f]{6}$'
        secondary_color:
          type:
            - string
            - 'null'
          pattern: '^#[0-9A-Fa-f]{6}$'

    AiVideoPayer:
      type: string
      description: Who pays for recording, analysis and video. `off` turns Smart Court off for the club.
      enum: [off, club_pays, player_pays]

    AdminModules:
      type: object
      description: Feature flags of a club (SA-05).
      required: [deposit, branding, lesson_mode, ai_video, tournaments]
      additionalProperties: false
      properties:
        deposit:
          $ref: '#/components/schemas/DepositModule'
        branding:
          $ref: '#/components/schemas/BrandingModule'
        lesson_mode:
          type: string
          enum: [app, whatsapp]
          description: Whether lessons are booked in the app or the coach is opened on WhatsApp.
        ai_video:
          $ref: '#/components/schemas/AiVideoPayer'
        tournaments:
          type: boolean

    AdminClubModules:
      type: object
      required: [club_id, modules, estimated_monthly_cents, tariff_version_id]
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        modules:
          $ref: '#/components/schemas/AdminModules'
        estimated_monthly_cents:
          description: Subscription tier plus the price of every enabled module. `null` while the club has no subscription to price against.
          oneOf:
            - $ref: '#/components/schemas/AmountCents'
            - type: 'null'
        tariff_version_id:
          description: Tariff version the estimate uses. `null` together with `estimated_monthly_cents`.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'

    AdminClubModulesUpdate:
      type: object
      required: [modules]
      additionalProperties: false
      properties:
        modules:
          $ref: '#/components/schemas/AdminModules'

    AdminPaymentMethod:
      type: string
      enum: [transfer, cash, check, card_in_person]

    AdminOnboardingPayment:
      type: object
      description: The first payment, taken in person (SA-04 step 3).
      required: [amount_cents, method, paid_on]
      additionalProperties: false
      properties:
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        method:
          $ref: '#/components/schemas/AdminPaymentMethod'
        paid_on:
          type: string
          format: date
        reference:
          type: string
          maxLength: 120
          description: Transfer number or receipt id.
        receipt_media_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Uploaded proof of payment, if any.

    AdminOnboardingCourt:
      type: object
      required: [name, kind, covered, price_cents_per_hour]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 60
        kind:
          type: string
          enum: [standard, panoramic]
        covered:
          type: boolean
        price_cents_per_hour:
          $ref: '#/components/schemas/AmountCents'

    AdminClubOnboarding:
      type: object
      description: Everything the on-site wizard collects (SA-04).
      required: [name, legal, owner, plan, tariff_version_id, modules, payment, courts]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        legal:
          $ref: '#/components/schemas/AdminLegalData'
        owner:
          type: object
          description: Person invited as club owner.
          required: [name, phone]
          additionalProperties: false
          properties:
            name:
              type: string
              maxLength: 120
            phone:
              type: string
              pattern: '^\+[1-9]\d{7,14}$'
            email:
              type: string
              maxLength: 254
              description: Email address.
        plan:
          $ref: '#/components/schemas/ClubPlan'
        tariff_version_id:
          $ref: '#/components/schemas/Uuid'
        modules:
          $ref: '#/components/schemas/AdminModules'
        payment:
          $ref: '#/components/schemas/AdminOnboardingPayment'
        courts:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminOnboardingCourt'

    AdminUserRef:
      type: object
      required: [id, name, role]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        role:
          type: string
          description: Club role (`owner`, `staff`, `coach`).

    AdminAuditEvent:
      type: object
      description: One immutable entry of `audit_log`.
      required: [id, at, actor_id, actor_role, action, club_id, target, reason]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        at:
          $ref: '#/components/schemas/Timestamp'
        actor_id:
          $ref: '#/components/schemas/Uuid'
        actor_role:
          type: string
          enum: [admin, sales, support, finance]
        action:
          type: string
          description: Dotted key, e.g. `club.suspended`, `payment.recorded`, `video.viewed`.
        club_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        target:
          type: string
          description: What changed, e.g. `club:0192...` or `match:0192...`.
        reason:
          type:
            - string
            - 'null'

    AdminAuditEventPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminAuditEvent'

    AdminUsageRow:
      type: object
      description: Usage of a club in a month (SA-06).
      required:
        - club_id
        - club_name
        - period
        - tier_usage
        - bookings
        - recorded_matches
        - storage_gb
        - video_minutes
        - estimated_cost_cents
        - invoiced_cents
        - near_limit
        - trend
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        club_name:
          type: string
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        tier_usage:
          $ref: '#/components/schemas/AdminTierUsage'
        bookings:
          type: integer
          minimum: 0
        recorded_matches:
          type: integer
          minimum: 0
        storage_gb:
          type: number
          minimum: 0
        video_minutes:
          type: integer
          minimum: 0
        estimated_cost_cents:
          $ref: '#/components/schemas/AmountCents'
          description: Our infrastructure cost for the club in the month.
        invoiced_cents:
          $ref: '#/components/schemas/AmountCents'
        near_limit:
          type: boolean
          description: True when the club is within 10% of the next band.
        trend:
          type: array
          maxItems: 12
          description: Active players at the end of each of the last months, oldest first (sparkline).
          items:
            type: integer
            minimum: 0

    AdminUsagePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUsageRow'

    AdminInvoiceStatus:
      type: string
      enum: [draft, issued, paid, overdue, void]

    AdminInvoice:
      type: object
      description: Subscription invoice from us to a club.
      required:
        [
          id,
          club_id,
          club_name,
          period,
          status,
          amount_cents,
          paid_cents,
          due_on,
          invoice_number,
          issued_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club_id:
          $ref: '#/components/schemas/Uuid'
        club_name:
          type: string
        period:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        status:
          $ref: '#/components/schemas/AdminInvoiceStatus'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        paid_cents:
          $ref: '#/components/schemas/AmountCents'
        due_on:
          type: string
          format: date
        invoice_number:
          type:
            - string
            - 'null'
          description: ARCA number once issued.
        issued_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    AdminInvoicePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminInvoice'

    AdminClubPayment:
      type: object
      required:
        [
          id,
          club_id,
          amount_cents,
          method,
          paid_on,
          reference,
          invoice_ids,
          recorded_by,
          recorded_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        club_id:
          $ref: '#/components/schemas/Uuid'
        amount_cents:
          $ref: '#/components/schemas/AmountCents'
        method:
          $ref: '#/components/schemas/AdminPaymentMethod'
        paid_on:
          type: string
          format: date
        reference:
          type:
            - string
            - 'null'
        invoice_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        recorded_by:
          $ref: '#/components/schemas/Uuid'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'

    AdminManualPaymentCreate:
      type: object
      required: [amount_cents, method, paid_on]
      additionalProperties: false
      properties:
        amount_cents:
          type: integer
          minimum: 1
          description: Amount in ARS cents.
        method:
          $ref: '#/components/schemas/AdminPaymentMethod'
        paid_on:
          type: string
          format: date
        reference:
          type: string
          maxLength: 120
          description: Receipt or transfer id; unique per club.
        invoice_ids:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/Uuid'
        note:
          type: string
          maxLength: 500

    AdminDunningPauseUpdate:
      type: object
      required: [paused_until, reason]
      additionalProperties: false
      properties:
        paused_until:
          oneOf:
            - type: string
              format: date
            - type: 'null'
          description: Last day of the pause, up to 60 days ahead; `null` resumes dunning.
        reason:
          type: string
          minLength: 3
          maxLength: 500

    AdminClubBilling:
      type: object
      description: B2B account statement of a club (SA-08).
      required:
        [
          club_id,
          status,
          balance_cents,
          overdue_days,
          dunning_paused_until,
          invoices,
          payments,
          timeline,
        ]
      properties:
        club_id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/AdminClubStatus'
        balance_cents:
          type: integer
          description: Positive is what the club owes. ARS cents.
        overdue_days:
          type: integer
          minimum: 0
        dunning_paused_until:
          oneOf:
            - type: string
              format: date
            - type: 'null'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/AdminInvoice'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/AdminClubPayment'
        timeline:
          type: array
          description: Reminders, suspensions and reactivations, newest first.
          items:
            type: object
            required: [at, kind]
            properties:
              at:
                $ref: '#/components/schemas/Timestamp'
              kind:
                type: string
                enum:
                  [
                    invoice_issued,
                    reminder_sent,
                    payment_recorded,
                    dunning_paused,
                    dunning_resumed,
                    suspended,
                    reactivated,
                  ]

    AdminClubDetail:
      type: object
      description: Club file for the console (SA-03a).
      required:
        [
          id,
          name,
          status,
          plan,
          legal,
          modules,
          tier_usage,
          billing,
          users,
          recent_audit,
          whitelabel_url,
          created_at,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        status:
          $ref: '#/components/schemas/AdminClubStatus'
        plan:
          $ref: '#/components/schemas/ClubPlan'
        legal:
          $ref: '#/components/schemas/AdminLegalData'
        modules:
          $ref: '#/components/schemas/AdminModules'
        tier_usage:
          $ref: '#/components/schemas/AdminTierUsage'
        billing:
          type: object
          required: [balance_cents, overdue_days, last_payment_at]
          properties:
            balance_cents:
              type: integer
            overdue_days:
              type: integer
              minimum: 0
            last_payment_at:
              oneOf:
                - $ref: '#/components/schemas/Timestamp'
                - type: 'null'
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserRef'
        recent_audit:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminAuditEvent'
        whitelabel_url:
          type: string
          format: uri
          description: Link and QR payload of the club's white-label page.
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AdminModulePrice:
      type: object
      required: [module, monthly_cents]
      additionalProperties: false
      properties:
        module:
          type: string
          enum:
            [
              deposit,
              branding_own,
              lessons_app,
              ai_video_club_pays,
              ai_video_player_pays,
              tournaments,
            ]
        monthly_cents:
          $ref: '#/components/schemas/AmountCents'

    AdminTariffTier:
      type: object
      description: One band of active players and the monthly subscription it costs (decision #253).
      required: [min_active_players, max_active_players, monthly_cents]
      additionalProperties: false
      properties:
        min_active_players:
          type: integer
          minimum: 0
        max_active_players:
          type:
            - integer
            - 'null'
          minimum: 1
          description: '`null` for the top band.'
        monthly_cents:
          $ref: '#/components/schemas/AmountCents'

    AdminTariffVersionCreate:
      type: object
      required: [name, effective_from, tiers, module_prices]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        effective_from:
          type: string
          format: date
        tiers:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/AdminTariffTier'
        module_prices:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AdminModulePrice'

    AdminTariffVersion:
      allOf:
        - $ref: '#/components/schemas/AdminTariffVersionCreate'
        - type: object
          required: [id, published_by, published_at, clubs_on_version]
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            published_by:
              $ref: '#/components/schemas/Uuid'
            published_at:
              $ref: '#/components/schemas/Timestamp'
            clubs_on_version:
              type: integer
              minimum: 0

    AdminTariffVersionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminTariffVersion'

    AdminInvoiceSimulationRequest:
      type: object
      description: Give `tariff_version_id` for a published version or `draft` for an unpublished one.
      required: [active_players, modules]
      additionalProperties: false
      properties:
        tariff_version_id:
          $ref: '#/components/schemas/Uuid'
        draft:
          $ref: '#/components/schemas/AdminTariffVersionCreate'
        active_players:
          type: integer
          minimum: 0
        modules:
          $ref: '#/components/schemas/AdminModules'

    AdminInvoiceSimulation:
      type: object
      required: [tier, subscription_cents, modules_cents, total_cents]
      properties:
        tier:
          $ref: '#/components/schemas/PricingTier'
        subscription_cents:
          $ref: '#/components/schemas/AmountCents'
        modules_cents:
          $ref: '#/components/schemas/AmountCents'
        total_cents:
          $ref: '#/components/schemas/AmountCents'

    AdminSupportAccessCreate:
      type: object
      required: [match_id, reason, duration_minutes]
      additionalProperties: false
      properties:
        match_id:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Why support needs the video, e.g. a ticket id.
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 240

    AdminSupportAccess:
      type: object
      required: [id, match_id, club_id, granted_to, reason, expires_at, audit_event_id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        match_id:
          $ref: '#/components/schemas/Uuid'
        club_id:
          $ref: '#/components/schemas/Uuid'
        granted_to:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        audit_event_id:
          $ref: '#/components/schemas/Uuid'
          description: The `audit_log` entry that registers the permission.

    AdminVideoUrl:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: One hour after the call, or sooner if the permission ends first.

