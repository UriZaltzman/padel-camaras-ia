openapi: 3.1.0

info:
  title: Padel Camera Platform API
  version: 0.1.0
  summary: Public REST contract for the mobile app, the web, the club panel and the club device.
  description: |
    REST API with JSON bodies under `/v1`. This file is the single source of truth: TypeScript
    and Pydantic types are generated from it and are never written by hand.

    ## Conventions

    - JSON property names are `snake_case`.
    - IDs are UUID v7 (`Uuid`).
    - Timestamps are RFC 3339 in UTC (`Timestamp`). Clients display them in
      `America/Argentina/Buenos_Aires`.
    - Money is an integer number of ARS cents (`AmountCents`). Never decimals.
    - Every response carries an `X-Request-Id` header. Support uses it to find the request in the
      structured logs.

    ## Errors

    Every 4xx and 5xx response has the same body, the `Error` schema: `{code, message, details}`.

    - `code` is a stable, upper-case identifier from the `ErrorCode` catalog (for example
      `BOOKING_SLOT_TAKEN`). Clients branch on `code`, never on `message` or on the HTTP status
      alone. Codes are never renamed or reused; removing one requires a new major version.
    - `message` is a short text for the end user, in `es-AR`, taken from the API translation
      files. Clients may show it as a fallback when they have no copy of their own for `code`.
    - `details` is optional and machine-readable. Its shape depends on `code` and is documented in
      the catalog. It never contains personal data, tokens or stack traces: technical detail goes
      to the log, linked by `X-Request-Id`.

    HTTP status usage: `400` malformed request, `401` missing or invalid credentials, `403` not
    allowed, `404` not found (also used when the caller may not know the resource exists), `409`
    conflict with the current state, `410` gone for good, `422` well-formed but breaks a business
    rule, `429` rate limited, `5xx` server or provider failure.

    ## Pagination

    Lists use opaque cursors: `?cursor=&limit=`. `limit` defaults to 20 and accepts 1 to 50; a value
    outside that range is rejected with `VALIDATION_FAILED`. The response wraps the items in a
    page object whose `next_cursor` is `null` on the last page. Clients pass `next_cursor` back
    unchanged; a malformed or expired cursor returns `INVALID_CURSOR`. List operations reuse the
    `Cursor` and `Limit` parameters and build their response schema with `allOf` over `Page`.

    ## Rate limits

    60 requests per minute per authenticated user, and per client IP for unauthenticated
    requests. Every response carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset`. Going over the limit returns `429` with `RATE_LIMITED` and a `Retry-After`
    header in seconds.
  contact:
    name: arquitecto (contract owner)
    url: https://github.com/UriZaltzman/padel-camaras-ia
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-rate-limit:
    requests: 60
    window_seconds: 60
    scope: user

servers:
  - url: /v1
    description: Same host as the client. Each environment serves the API under `/v1`.

security:
  - bearerAuth: []

tags:
  - name: Tournaments
    description: Club tournaments - registration, draw, fixture, results and ranking points.
  - name: System
    description: Liveness and operational endpoints.
  - name: Device
    description: Club device (mTLS) - schedule, heartbeat, pipeline results and uploads.
  - name: Auth
    description: Sign-in with a WhatsApp code, Google or Apple, and session renewal.
  - name: Users
    description: The signed-in user's profile, matches, stats and account deletion.
  - name: Matches
    description: Match detail, "este soy yo", score corrections and clips cut in the app.
  - name: Media
    description: Signed 1-hour links and downloads of videos, clips, reels and thumbnails.
  - name: Clubs
    description: Clubs, their courts and booking rules, and the owner's club settings.
  - name: Lessons
    description: Coach lessons, notes and drawings, and the coach's students.
  - name: Payments
    description: Mercado Pago checkouts (deposits, extras, lessons) and the payment webhook.
  - name: Bookings
    description: Court availability, holds, invites, cancellations and fixed weekly turns.
  - name: ClubAdmin
    description: Club panel for staff and owner. Staff never see personal stats or money.
  - name: Admin
    description: Internal console for our team - clubs, onboarding, modules, usage, tariffs, B2B billing, support access and audit.

# Every operation must:
# - document `429` and reference `components/responses` for every 4xx and 5xx response;
# - reuse `Cursor` and `Limit` when it returns a list.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness probe
      description: |
        The process is up and serving. It does not check the database or Redis yet. No
        credentials needed.
      security: []
      responses:
        '200':
          description: The API is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /device/schedule:
    get:
      operationId: getDeviceSchedule
      tags: [Device]
      summary: Turns to record in the next 48 hours (club device)
      description: |
        The `scheduler` process calls this every minute and stores the answer in its local
        SQLite, so it keeps recording from the stored copy for up to 48 hours without internet
        (section 4). The device is identified by its client certificate (mTLS); it only gets
        its own club's courts. Recording starts at `record_from` (2 minutes before the turn)
        and ends at `record_until` (2 minutes after). Turns with `no_record: true` are listed
        so the device knows the court is busy, but must not be recorded.

        Not paginated: 48 hours of a club fit in one response. `ETag` / `If-None-Match` avoid
        resending an unchanged schedule (`304`).

        Errors: `DEVICE_CERTIFICATE_INVALID` (401).
      security:
        - deviceMtls: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The schedule.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSchedule'
              example:
                club_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a60
                generated_at: '2026-10-23T21:00:00Z'
                valid_until: '2026-10-25T21:00:00Z'
                items:
                  - match_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
                    booking_id: 0192b1e4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    court_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a61
                    match_type: match
                    starts_at: '2026-10-23T22:00:00Z'
                    ends_at: '2026-10-23T23:30:00Z'
                    record_from: '2026-10-23T21:58:00Z'
                    record_until: '2026-10-23T23:32:00Z'
                    no_record: false
                    scoring:
                      golden_point: true
                      third_set: super_tiebreak
                    updated_at: '2026-10-22T15:04:00Z'
        '304':
          description: Unchanged since the given `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/heartbeat:
    post:
      operationId: postDeviceHeartbeat
      tags: [Device]
      summary: Health report every 60 seconds (club device)
      description: |
        The `health` process reports free disk, GPU temperature, each camera and the queues
        (section 4). Three missed heartbeats mark the device offline and emit `device.offline`;
        a camera down for more than 5 minutes during a turn alerts the club and support. The
        response carries the server time (to detect clock drift beyond NTP) and the software
        version the `updater` should run.

        Errors: `DEVICE_CERTIFICATE_INVALID` (401), `DEVICE_CLUB_MISMATCH` (403, a camera of
        another club), `VALIDATION_FAILED` (400).
      security:
        - deviceMtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeat'
            example:
              sent_at: '2026-10-23T22:41:00Z'
              software_version: 0.4.2
              uptime_seconds: 86400
              disk_free_bytes: 1374389534720
              disk_total_bytes: 2000398934016
              gpu_temp_c: 71.0
              cpu_temp_c: 58.5
              cameras:
                - camera_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a90
                  online: true
                  fps: 25.0
                  recording: true
                - camera_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a91
                  online: true
                  fps: 24.9
                  recording: true
              upload_queue:
                items: 14
                bytes: 5368709120
                eta_minutes: 95
              processing_backlog_minutes: 40
      responses:
        '200':
          description: Heartbeat stored.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHeartbeatAck'
              example:
                server_time: '2026-10-23T22:41:00Z'
                desired_software_version: 0.4.2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/matches/{id}/results:
    post:
      operationId: postMatchResults
      tags: [Device]
      summary: Upload the pipeline results of a match (club device)
      description: |
        The `uploader` sends this first, before clips and video (priority 1, section 4). The
        body is the `MatchResults` format shared by `ml` (which produces it) and
        `services/edge-agent` (which sends it); its full example is `MatchResultsExample`.

        - The match moves `processing` → `published` (or `failed` with `status: failed`), and
          `match.processed` is emitted. The cloud stores points, shots and bounces, takes the
          device stats as a first version and recomputes them with the same versioned formulas
          after any score correction.
        - Idempotent by `run_id`: resending the same run returns `202` without changes. A new
          `run_id` (reprocess) replaces the previous results.
        - Media is referenced by the `media_id` returned by `POST /device/uploads`; uploads may
          finish after the results.

        Errors: `DEVICE_CERTIFICATE_INVALID` (401), `DEVICE_CLUB_MISMATCH` (403),
        `INVALID_STATE_TRANSITION` (409, the match is not `recorded` or `processing`),
        `VALIDATION_FAILED` (400), `NOT_FOUND`.
      security:
        - deviceMtls: []
      parameters:
        - $ref: '#/components/parameters/DeviceMatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchResults'
            examples:
              full:
                $ref: '#/components/examples/MatchResultsExample'
      responses:
        '202':
          description: Results accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResultsAck'
              example:
                match_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
                run_id: 0192f0a0-1b2c-7d3e-8f4a-5b6c7d8e9f00
                match_status: published
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/uploads:
    post:
      operationId: createDeviceUpload
      tags: [Device]
      summary: Get signed multipart upload links for a video, clip, reel or thumbnail
      description: |
        Starts a resumable multipart upload to private storage (section 4, `uploader`). The
        device uploads each part with `PUT` to its signed `url` (valid 1 hour; call again with
        the same `upload_id` to get fresh links for missing parts), then calls
        `POST /device/uploads/{id}/complete`. Idempotent by `sha256` + `match_id` + `kind`.
        The device never receives permanent links.

        Errors: `DEVICE_CERTIFICATE_INVALID` (401), `DEVICE_CLUB_MISMATCH` (403),
        `VALIDATION_FAILED` (400), `NOT_FOUND` (match or upload).
      security:
        - deviceMtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUploadRequest'
            example:
              match_id: 01928f6e-7c1a-7d4e-9b3a-2f6c8e1d4a5b
              kind: full
              content_type: video/mp4
              size_bytes: 1073741824
              sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              duration_ms: 5520000
      responses:
        '201':
          description: The upload with its signed part links.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUpload'
              example:
                upload_id: 0192f0b0-1b2c-7d3e-8f4a-5b6c7d8e9f01
                media_id: 0192af6e-7c1a-7d4e-9b3a-2f6c8e1d4a55
                part_size_bytes: 67108864
                parts:
                  - number: 1
                    url: https://storage.example.com/full/0192af6e.mp4?partNumber=1&uploadId=abc&X-Amz-Signature=1a2b
                expires_at: '2026-10-24T05:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /device/uploads/{id}/complete:
    post:
      operationId: completeDeviceUpload
      tags: [Device]
      summary: Finish a multipart upload
      description: |
        Closes the multipart upload with the `ETag` of each part. The API checks size and
        `sha256`, marks the media `ready` and, for clips, emits `clip.created`. After this the
        device may delete its original once the analysis is done (section 4, disk).

        Errors: `DEVICE_CLUB_MISMATCH` (403), `VALIDATION_FAILED` (400, missing part or checksum
        mismatch), `NOT_FOUND`.
      security:
        - deviceMtls: []
      parameters:
        - $ref: '#/components/parameters/DeviceUploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUploadComplete'
            example:
              parts:
                - number: 1
                  etag: '"a54357aff0632cce46d942af68356b38"'
      responses:
        '200':
          description: Upload completed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUploadDone'
              example:
                upload_id: 0192f0b0-1b2c-7d3e-8f4a-5b6c7d8e9f01
                media_id: 0192af6e-7c1a-7d4e-9b3a-2f6c8e1d4a55
                status: ready
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/otp/whatsapp:
    post:
      operationId: requestWhatsappOtp
      tags: [Auth]
      summary: Send a sign-in code by WhatsApp
      description: |
        Sends a 6-digit code to the phone by WhatsApp. The code is valid for 5 minutes and allows
        5 attempts. Asking again replaces the previous code. The response is the same whether or
        not the phone has an account, so it does not reveal who is registered.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phone: '+5491155550123'
      responses:
        '202':
          description: The code was sent (or queued for sending).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                expires_in_seconds: 300
                resend_after_seconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/verify:
    post:
      operationId: verifyWhatsappOtp
      tags: [Auth]
      summary: Sign in with the WhatsApp code
      description: |
        Checks the code and returns a session. If the phone has no account yet, one is created;
        `consent` is then required, otherwise the answer is `403 TERMS_NOT_ACCEPTED` and the
        code stays valid so the app can retry with consent. For existing accounts `consent` is
        ignored.

        Errors: `OTP_INVALID` (with `attempts_remaining`), `OTP_EXPIRED`,
        `OTP_ATTEMPTS_EXCEEDED`, `TERMS_NOT_ACCEPTED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            examples:
              sign_up:
                summary: New account, accepting terms and privacy
                value:
                  phone: '+5491155550123'
                  code: '482913'
                  consent:
                    terms_version: '2026-10-01'
                    privacy_version: '2026-10-01'
              sign_in:
                summary: Existing account
                value:
                  phone: '+5491155550123'
                  code: '482913'
      responses:
        '200':
          description: Signed in. `is_new_user` tells the app whether to show onboarding.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/google:
    post:
      operationId: signInWithGoogle
      tags: [Auth]
      summary: Sign in with Google
      description: |
        Exchanges a Google ID token (obtained by the app or web with the Google SDK) for a
        session. The server verifies signature, audience and expiry. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthSignInRequest'
            example:
              id_token: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
              nonce: 3f9c2a7b1e
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/oauth/apple:
    post:
      operationId: signInWithApple
      tags: [Auth]
      summary: Sign in with Apple
      description: |
        Exchanges an Apple identity token for a session. Apple sends the user's name only on the
        first authorization, so the app forwards it in `full_name` that time. A new account needs
        `consent`, as in `verifyWhatsappOtp`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
            example:
              id_token: eyJraWQiOiJXNldjT0tCIiwiYWxnIjoiUlMyNTYifQ...
              nonce: 8d1e4b6a0c
              full_name: Sofía Pérez
              consent:
                terms_version: '2026-10-01'
                privacy_version: '2026-10-01'
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                new_user:
                  $ref: '#/components/examples/AuthSessionExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Renew the session
      description: |
        Exchanges a refresh token (valid 30 days) for a new access token (15 minutes) and a new
        refresh token. The old refresh token is revoked on use; presenting it again returns
        `REFRESH_TOKEN_INVALID` and revokes the whole token family (reuse detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5b.Zx8kQ2
      responses:
        '200':
          description: New token pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiIwMTky...
                refresh_token: rt_01928f6e7c1a7d4e9b3a2f6c8e1d4a5c.Yp3nR7
                token_type: Bearer
                expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get the signed-in user's profile
      description: The full own profile, including the consents and the training preference.
      responses:
        '200':
          description: The profile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                player:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
