          $ref: '#/components/responses/InternalError'

  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [Admin]
      summary: List B2B invoices (SA-08)
      description: |
        Subscription invoices to clubs across the platform, newest first, filtered by status, club or due date. Roles: admin, finance. Only internal staff (`/admin/*` never accepts a club or player token). Every write is recorded in `audit_log` with the actor, the club and the before/after values (section 12).

        Errors: `FORBIDDEN`, `VALIDATION_FAILED`, `INVALID_CURSOR`.

      x-required-role: admin,finance
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: club_id
          in: query
          required: false
          description: Only this club's invoices.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: status
          in: query
          required: false
          description: Only invoices in this status.
          schema:
            $ref: '#/components/schemas/AdminInvoiceStatus'
        - name: due_before
          in: query
          required: false
          description: Only invoices due on or before this local date.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One page of invoices.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvoicePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/support-access:
    post:
      operationId: grantAdminSupportAccess
      tags: [Admin]
      summary: Register permission to see a video
      description: |
        Support can see a match video only with a permission registered in `audit_log` (section 12). This call registers it: who, which match, the reason (for example a ticket id) and for how long (maximum 4 hours). It does not return the video; use `GET /admin/matches/{id}/video-url` afterwards. Roles: admin, support. Only internal staff (`/admin/*` never accepts a club or player token). Every write is recorded in `audit_log` with the actor, the club and the before/after values (section 12).

        Errors: `FORBIDDEN`, `NOT_FOUND`, `VALIDATION_FAILED`.

      x-required-role: admin,support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSupportAccessCreate'
      responses:
        '201':
          description: The permission, now in the audit log.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSupportAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/matches/{id}/video-url:
    get:
      operationId: getAdminMatchVideoUrl
      tags: [Admin]
      summary: Signed link to a match video for support
      description: |
        Returns a signed 1-hour link to the full video, only while the caller holds an unexpired permission from `POST /admin/support-access` for this match. Every call is logged in `audit_log`. Roles: admin, support. Only internal staff (`/admin/*` never accepts a club or player token). Every write is recorded in `audit_log` with the actor, the club and the before/after values (section 12).

        Errors: `FORBIDDEN`, `NOT_FOUND`, `SUPPORT_ACCESS_NOT_GRANTED` (403, no valid permission for this match), `MEDIA_NOT_READY` (409), `MEDIA_EXPIRED` (410).

      x-required-role: admin,support
      parameters:
        - $ref: '#/components/parameters/MatchId'
      responses:
        '200':
          description: The signed link.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVideoUrl'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags: [Admin]
      summary: Audit log (SA-12)
      description: |
        Immutable log of sensitive actions, newest first: club changes, suspensions, payments, tariff publications and video access. Roles: admin only. Only internal staff (`/admin/*` never accepts a club or player token). Every write is recorded in `audit_log` with the actor, the club and the before/after values (section 12).

        Errors: `FORBIDDEN`, `VALIDATION_FAILED`, `INVALID_CURSOR`.

