[project]
name = "app-contracts"
version = "0.0.0"
description = "Pydantic v2 models generated from openapi/openapi.yaml. Never edited by hand."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/app_contracts"]

[tool.ruff]
extend = "../config/ruff.toml"
extend-exclude = ["node_modules"]

[tool.ruff.lint.per-file-ignores]
# Same as the shared config: its "**/tests/**" glob is resolved relative to
# packages/config, so it does not reach this project's tests.
"tests/**" = ["S101", "PLR2004", "ANN"]
# Error codes such as ACCESS_TOKEN_EXPIRED are not passwords.
"generated/**" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["generated/python"]
