[project]
name = "hardware-bom"
version = "0.0.0"
description = "Schema, loader and totals for infra/hardware/bom.yaml (club kit bill of materials)."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_bom"]

[tool.ruff]
extend = "../../packages/config/ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Same as the shared config: its "**/tests/**" glob is resolved relative to
# packages/config, so it does not reach this project's tests.
"tests/**" = ["S101", "PLR2004", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
