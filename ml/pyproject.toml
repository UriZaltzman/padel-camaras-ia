[project]
name = "ml"
version = "0.0.0"
description = "Computer vision pipeline, training and evaluation."
requires-python = ">=3.12,<3.13"
dependencies = ["app-config", "pydantic>=2.9"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
app-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
extend = "../packages/config/ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
