# Labeling tool settings: server, timeline steps and keyboard shortcuts.
# These are UI constants, not AI thresholds (those live in thresholds.yaml).
server:
  host: '127.0.0.1'
  port: 8765
  video_chunk_bytes: 1048576
  max_body_bytes: 4096
timeline:
  seek_step_ms: 2000
  fine_step_ms: 40
  nudge_step_ms: 20
  playback_rates: [0.25, 0.5, 1.0]
# key: the KeyboardEvent.key value. track_id: player of a shot. surface: bounce surface.
shortcuts:
  - { key: ' ', action: play_pause }
  - { key: 'ArrowLeft', action: seek_back }
  - { key: 'ArrowRight', action: seek_forward }
  - { key: ',', action: seek_back_fine }
  - { key: '.', action: seek_forward_fine }
  - { key: 'p', action: cycle_rate }
  - { key: '1', action: shot, track_id: 0 }
  - { key: '2', action: shot, track_id: 1 }
  - { key: '3', action: shot, track_id: 2 }
  - { key: '4', action: shot, track_id: 3 }
  - { key: 'f', action: bounce, surface: floor }
  - { key: 'g', action: bounce, surface: back_glass }
  - { key: 'l', action: bounce, surface: side_glass }
  - { key: 'r', action: bounce, surface: fence }
  - { key: 'n', action: bounce, surface: net }
  - { key: 's', action: toggle_side }
  - { key: 'ArrowUp', action: select_prev }
  - { key: 'ArrowDown', action: select_next }
  - { key: '[', action: nudge_back }
  - { key: ']', action: nudge_forward }
  - { key: 'm', action: move_to_playhead }
  - { key: 'Backspace', action: delete_selected }
  - { key: 'z', action: undo }
  - { key: 'Enter', action: save }
  - { key: 't', action: toggle_mode }
  - { key: 'u', action: next_unclassified }
# Shot-type mode: a clip of clip_before_ms + clip_after_ms around each shot (1 s in total)
# loops while the labeler picks its type. target_per_type is the goal of spec section 8.
shot_type:
  clip_before_ms: 500
  clip_after_ms: 500
  target_per_type: 150
  shortcuts:
    - { key: '1', shot_type: serve }
    - { key: '2', shot_type: forehand }
    - { key: '3', shot_type: backhand }
    - { key: '4', shot_type: forehand_volley }
    - { key: '5', shot_type: backhand_volley }
    - { key: '6', shot_type: bandeja }
    - { key: '7', shot_type: vibora }
    - { key: '8', shot_type: smash }
    - { key: '9', shot_type: lob }
    - { key: '0', shot_type: off_the_wall }
    - { key: 'x', shot_type: unknown }
# Points mode: mark where each point starts and ends, who won it and why it ended.
# point_end closes the started point with its winner; point_reason sets the end reason of
# the selected point; point_set_start / point_set_end move its bounds to the playhead.
points:
  shortcuts:
    - { key: 'i', action: point_start }
    - { key: 'Escape', action: point_cancel }
    - { key: '1', action: point_end, winner: '1' }
    - { key: '2', action: point_end, winner: '2' }
    - { key: 'a', action: point_set_start }
    - { key: 'e', action: point_set_end }
    - { key: 'd', action: point_reason, end_reason: double_fault }
    - { key: 'o', action: point_reason, end_reason: own_floor }
    - { key: 'n', action: point_reason, end_reason: net }
    - { key: 'w', action: point_reason, end_reason: direct_wall }
    - { key: 'b', action: point_reason, end_reason: double_bounce }
    - { key: 'f', action: point_reason, end_reason: out_of_court }
    - { key: 'l', action: point_reason, end_reason: ball_lost }
    - { key: 'x', action: point_reason, end_reason: other }
