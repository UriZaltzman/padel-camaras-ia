# Every AI threshold lives here (CLAUDE.md: no magic numbers). Owned by vision-ia.
# Initial values come from docs/especificacion-tecnica.md sections 5 to 7.
# Loaded and validated by ml.thresholds.load_thresholds(): a missing key, an unknown key
# or a value of the wrong type stops the pipeline at startup.
# Units are in the key name: _m metres, _cm centimetres, _s seconds, _deg degrees,
# _px pixels, _frames video frames, _share a fraction between 0 and 1.

# Section 5: court geometry. Origin at the side-A corner, y runs along the 20 m length.
court:
  width_m: 10.0
  length_m: 20.0
  net_y_m: 10.0
  net_height_center_m: 0.88
  net_height_posts_m: 0.92
  service_line_from_net_m: 6.95
  # Default glass-and-fence plan (spec 5.8); a court that differs loads its own SurfacePlan.
  back_glass_height_m: 3.0
  wall_height_m: 4.0
  side_glass_from_back_m: 4.0
  ball_radius_m: 0.0335

# Section 5.1: calibration.
calibration:
  reference_points: 12
  max_mean_error_cm: 5.0
  daily_check_local_hour: 7
  court_mask_margin_m: 1.5
  # RANSAC inlier distance on the undistorted image, and its confidence and iteration cap.
  ransac_reproj_threshold_px: 5.0
  ransac_confidence: 0.995
  ransac_max_iters: 2000
  # Daily check: the stored calibration moved if the reference lines are this far off.
  drift_max_mean_shift_cm: 10.0

# Section 5.2: player detection.
players:
  min_confidence: 0.5
  players_on_court: 4

# Section 5.3: tracking (ByteTrack + Hungarian merge into exactly 4 tracks).
tracking:
  bytetrack_match_threshold: 0.5
  track_memory_s: 2.0

# Section 5.5: ball (TrackNetV3-style heatmap + constant-acceleration Kalman filter).
ball:
  input_width_px: 512
  input_height_px: 288
  input_frames: 3
  min_heatmap_peak: 0.5
  kalman_max_gap_frames: 10
  gravity_mps2: 9.81

# Section 5.5: per-camera smoothing of the ball track (constant-acceleration Kalman + RTS).
# Works on undistorted pixels. gate_sigma is the Mahalanobis distance above which a detection
# is an impossible jump. After reset_after_rejections in a row the track restarts there.
ball_track:
  measurement_sigma_px: 1.5
  process_accel_sigma_px_s2: 5000.0
  min_segment_points: 3
  # Fastest plausible ball in the image (about 40 m/s at 4 m from the lens). Detections that
  # imply more are false, and a new track starts only on two detections that agree.
  max_speed_px_s: 9000.0
  # The two detections that start a track are at most this many frames apart.
  start_max_gap_frames: 2
  gate_sigma: 6.0
  reset_after_rejections: 3
  min_confidence: 0.3
  initial_velocity_sigma_px_s: 3000.0
  initial_acceleration_sigma_px_s2: 60000.0

# Section 5 (geometry, 5.5): two-camera alignment and triangulation.
triangulation:
  min_confidence: 0.5
  sync_search_ms: 100.0
  sync_step_ms: 1.0
  sync_min_pairs: 20
  min_ray_angle_deg: 6.0
  max_ray_gap_m: 0.6
  min_height_m: -0.3
  max_height_m: 12.0
  max_time_gap_ms: 40.0
  max_bridge_ms: 400.0
  height_tolerance_m: 0.35

# Section 5.6: pose, only around candidate shots.
pose:
  window_s: 0.5
  keypoints: 17

# Section 5.7: shot detection.
shots:
  min_direction_change_deg: 35.0
  max_wrist_distance_m: 1.2
  # Velocity is fitted on each side of a candidate over this window, leaving out guard_ms.
  fit_window_ms: 250.0
  fit_guard_ms: 40.0
  min_fit_points: 3
  min_speed_change_share: 0.35
  min_speed_for_direction_mps: 2.0
  min_separation_ms: 250.0
  wrist_time_slack_ms: 60.0
  # Kinks this close to a surface contact are the same event seen through noise, not shots.
  contact_exclusion_ms: 100.0

# Section 5.8: bounce detection and surface classification.
bounces:
  fit_window_ms: 250.0
  fit_guard_ms: 40.0
  min_fit_points: 3
  min_normal_speed_change_mps: 4.4
  surface_tolerance_m: 0.35
  floor_tolerance_m: 0.3
  min_separation_ms: 120.0
  net_height_margin_m: 0.25
  net_residual_speed_share: 0.4
  # |dv . n| / |dv|: how much of the velocity change is along the surface normal.
  min_normal_alignment: 0.6
  # With at least this share of 3D frames the setup is dual-camera: kinks that only have a
  # floor position (one camera blind for a while) are too unreliable to call bounces.
  min_dual_camera_3d_share: 0.5

# Section 5.9: shot-type classifier.
shot_type:
  min_confidence: 0.6
  pose_half_window_frames: 15

# Section 6: point state machine and corrections.
# inferred_event_factor: confidence multiplier when the machine had to assume an event it did
# not see (a missing shot or bounce). anomaly_factor: same, for a duplicated hit by one pair.
# ball_lost_factor: rule 7 points are low confidence by definition.
# The alignment costs (layers 1 and 3) are in nats, -ln(1 - confidence) per flipped point.
point:
  ball_lost_timeout_s: 4.0
  min_confidence: 0.7
  serves_per_point: 2
  reopen_window_s: 2.5
  new_point_gap_s: 10.0
  inferred_event_factor: 0.85
  anomaly_factor: 0.85
  ball_lost_factor: 0.5
  inserted_point_confidence: 0.3
  max_event_confidence: 0.99
  insert_cost: 3.0
  delete_penalty: 1.0
  server_mismatch_cost: 2.5
  max_inserts_per_gap: 2
  beam_width: 250

# Section 6: scoring rules.
# points_per_game: 15, 30, 40, game. min_point_lead: advantage games and tie-breaks are won
# by this many points. sets_to_win: best of three.
scoring:
  points_per_game: 4
  min_point_lead: 2
  sets_to_win: 2
  games_per_set: 6
  min_game_lead: 2
  tiebreak_points: 7
  super_tiebreak_points: 10
  side_change_every_games: 2
  tiebreak_side_change_points: 6
  tiebreak_serve_run_points: 2

# Section 7: statistics (formula_version tracks changes to how these are used).
stats:
  zone_columns: 3
  zone_rows: 3
  net_zone_depth_m: 3.0
  coverage_uncovered_distance_m: 3.0
  net_unguarded_distance_m: 4.0
  net_unguarded_min_points: 3
  net_unguarded_min_lost_share: 0.25
  same_side_player_share: 0.6
  same_side_third_share: 0.5
  forced_error_move_distance_m: 3.0
  forced_error_move_time_s: 1.2
  net_time_distance_m: 4.0
  net_approach_from_m: 6.0
  net_approach_to_m: 4.0
  position_smoothing_window_s: 0.5
  heatmap_cell_m: 0.5
  ball_speed_frames_after_shot: 3

# Section 7: automatic highlights. Weights must add up to 1.
highlights:
  weight_rally_length: 0.4
  weight_smash_or_vibora_winner: 0.3
  weight_ball_speed: 0.2
  weight_key_point: 0.1
  top_points: 5
  tail_after_point_s: 2.0

# Section 7: phrase insights.
insights:
  facts_per_match: 3
  max_words_per_phrase: 15

# Section 7: vertical reel.
reel:
  width_px: 1080
  height_px: 1920
  min_duration_s: 20.0
  max_duration_s: 30.0
  logo_duration_s: 1.5
  highlights: 3

# Section 7: lesson mode.
lesson_mode:
  min_out_of_range_share: 0.4
  top_improvements: 3

# Section 7: player level (Glicko-2).
rating:
  min_matches_to_show: 5

# Section 4: sizing. Each camera must be analysed at least min_realtime_factor times faster
# than real time on an RTX 4060 class GPU, at analysis_fps. synthetic_* feed ml.bench.
performance:
  min_realtime_factor: 6.0
  analysis_fps: 25
  synthetic_duration_s: 10.0
  synthetic_width_px: 1280
  synthetic_height_px: 720
  synthetic_channels: 3
  gpu_probe_timeout_s: 5.0
